body:
  text: 卷上雜病准傷寒治法人病不止於傷寒而特立傷寒一法凡有病而治之皆當準此以為之繩度也傷寒傷風辨證傷寒無汗惡寒面色慘脈浮緊鼻壅閉而干傷風自汗惡風面色光澤其脈浮而緩鼻注清涕凡遇新得之病須要如此別之傷寒證足太陽經頭項痛腰脊強以少陽陽明太陽三經通論則此經為表以本經專論又當分表之表表之裡之異焉此經受邪最先外來之邪莫甚於寒寒不傷衛而傷榮衛不受傷則強寒主收斂閉藏所以無汗無汗衛強表之實也太陽之經有標有本標病則身熱本病則惡寒凡傷寒邪其候必頭項痛腰脊強脈浮疾大略與內傷同內傷則右關以上脈大於左口腹為之不利傷寒則左關以上脈大於右鼻息為之不利一二日宜麻黃湯主之此特舉其常數而已然有一日之內就傳經者亦有二三日只在一經者不可越經而治傷風證風陽邪也風喜傷衛衛既受傷則腠理為之不密所以自汗而惡風與寒邪傷人不同寒為肅殺之氣其色必慘風為鼓舞之氣其色必和各從其類也衛者外衛也對榮而言為表之表對無汗而言為表之虛脈來浮緩然其所可對者經絡標本而已是以頭項腰脊俱疼身表亦為之熱一二日間宜用桂枝湯主之其傳經與傷寒無異當以脈證辨之但桂枝湯頗燥非通於脈者不可用也遇此經症莫若用易老神術湯尤為穩當傷寒見風傷風見寒太陽症頭痛腰脊強發熱惡寒無汗本傷寒也又感風邪其脈浮緩是傷寒見風也太陽症頭項腰脊俱疼發熱惡風自汗本傷風也又感寒邪其脈浮緊是傷風見寒也舊用各半湯今用九味羌活湯傷寒傷風始得之症不同至傳經皆同故此後混為一治傷寒傷風傳至肌肉太陽經傷寒傷風失於解表則傳肌肉之間肌肉之間者衛榮之下是也衛榮屬太陽之標肌肉屬陽明之標邪傳至此當三二日發其經夾鼻絡於目眥額中從頭下至足行身之前以太陽一經而論則衛為表之表榮為表之裡以太陽少陽陽明三經而論則少陽為半表半裡陽明為表之裹太陽為表之表也去太陽未遠其脈尚浮已入陽明其脈乃長未至陽明之本是以几几而熱目疼鼻乾不得臥也惡寒症已罷不可純用辛熱之劑以發之若誤用麻黃桂枝則有發黃等症葛根湯主之傳筋風寒之襲人有傷經之邪有傳經之邪其傷經之邪在衛則桂枝湯在榮則麻黃湯其傳經之邪在肌肉則葛根湯在筋則用大青龍湯高下淺深各不同蓋榮衛為表之表肌肉為表之裡至於筋邪入深矣恃其未入腑故亦屬表之裡焉表症未已故頭項腰脊強痛身發熱脈浮緊里症將作故煩躁引飲過飲則停水所以大青龍湯內用石膏以解煩躁用杏仁以去水逆其有身熱嘔噦脈來浮而滑者則用小青龍湯主之傳少陽身之後屬太陽身之前屬陽明身之側屬少陽邪之襲人在太陽則惡寒在陽明則惡熱少陽居中介乎二者之間其經循脅絡於耳始於目銳眥終於竅陰交膻中邪傳至此一寒一熱胸脅痛耳聾嘔逆脈弦太陽在標可汗而解麻黃湯是也在本可滲而解五苓散是也陽明在標可以解肌葛根湯是也在本可下而解三承氣湯是也獨少陽居中不表不里開竅於膽有入無出故禁發汗禁下禁利小便唯宜和之以小柴胡湯然此方冷熱均平從乎中而治也苟里證居多表證居少又非此方所能也當治之以大柴胡湯傳陽明經邪之傷經有高下之不同邪之傳經有淺深之不一高則桂枝湯下則麻黃湯淺則葛根湯青龍湯半深半淺則小柴胡湯深則大柴胡湯三承氣湯自柴胡湯以前皆表之劑也自小柴胡湯以後皆下之劑也未入腑發之固有微甚矣已入腑下之豈無輕重乎故大柴胡湯治二分里一分表小承氣湯治痞實兩證調胃承氣治痞燥實三證大承氣治痞滿燥實四證各各不同也苟不審而行之不失之過則失之不及矣夫豈可乎傳三陰經陽經有太陽少陽陽明陰經有太陰少陰厥陰治陽經順而易治陰經逆而難所以易者以其治可得而一也所以難者以其治不可得而一也何也陽經之邪始寒而終熱有一定之法人所易知陰經之邪或寒而或熱無一定之法人所難知苟無所辨欲下之則有可溫之說以拒之於中欲溫之則有可下之說以撓之於內二者交戰於胸中殊無定見豈不誤人性命乎殊不知陰經之邪有二有自陽經而傳來者有不自陽經而直中者自陽經而傳來則為熱邪不自陽經來而直中則為寒邪熱邪為病在太陰則腹滿而嗌乾在少陰則口燥舌乾而渴在厥陰則煩滿而囊縮脈皆沉疾而有力是其經雖陰而證則陽矣其少陰厥陰雖有厥逆之症而內則實惡熱而欲得涼也寒邪為病在太陰則腹滿而吐利不渴在少陰則吐利慾寐足脛寒而小便色白惡寒踡臥或臍腹間痛在厥陰則手足厥冷小腹痛吐利而寒脈皆沉細而無力是其經既陰而症又陰也其少陰厥陰雖有燥有煩乾渴之症終是惡寒而大小便利也二者之邪其始之所得既不同其終之所至亦不同以此別之若睹黑白何難之有哉大凡臨症在兩似之間必須審其得病之始自陽經傳來或六七日或十數日得以上陽邪之候必須下之以承氣輩不自陽經傳來而直中之初病之間遂得以上陰邪之候必須溫之以四逆之輩庶免實實虛虛之禍而人無夭札之患矣結胸以下皆壞症也病屬於陽脈必浮數動滑當以汗解醫反攻裡裡虛則邪氣因之而入動於膈中而為結胸心下硬滿痛脈沉疾有力或如柔痓狀或心中懊憹或喘或舌上燥而或汗出際頸而還或水結心下其兼見之證雖不同而為結胸之證則一按之而痛或痛甚手不可近太陽標發熱與本經頭痛所傳者大陷胸湯太陽標與陽明經潮熱所傳者大陷胸丸太陽標與少陽經脅痛所傳者小陷胸湯臨症務要審詳痞痞病屬於陰脈必沉澀弱微弦誤下之為痞氣按之不痛謂之虛邪其狀心下妨滿唯所兼之證不同故所用之方亦不得而同也兼熱則用黃連大黃瀉心湯兼冷熱不調則用黃連大黃附子瀉心湯兼陰盛陽虛則用半夏瀉心湯甘草瀉心湯生薑瀉心湯蓋結胸之脈沉實其病謂之實邪故下之也急痞氣之脈關脈必浮其病謂之虛邪故下之也緩彼用大黃則煎之乃取其氣味厚此用大黃則漬之取其氣味之薄雖然亦必脈疾而證熱然後用此法否亦不得以易而試之其餘悉皆陰多陽少者蓋為病發於陰是以然也名為瀉心非瀉心火之熱瀉心下之痞也讀者毋以辭為主焉蓄血陽明證禁利小便誤之則蓄血下焦禁發汗誤之則蓄血上焦未至太陽本五苓散不中與也而與之則亦成蓄血焉外此又有不當汗而汗之為衄血為唾血當汗而不汗之為嘔血為吐血種種各異蓄血上焦必顯血證不待辨而可明也蓄血中下二焦本證多有不顯不容以不辨焉大凡得此症候小便自利一也大便褐色二也狂言見鬼小便淋三也小腹滿痛四也其人如狂喜忘者五也不思水或漱水不欲咽六也輕則桃仁承氣湯重則抵當湯在上則犀角地黃湯涼膈散加地黃中則桃仁承氣湯下則生地丸或抵當湯丸務以一方對一病毋容差失發黃脾屬土其色黃其性濕以是知黃為脾病也濕氣在裡復瘀熱於外脾胃蒸濕不散而生謂之濕黃當汗不汗當利小便而不利小便之過也病屬陽症而誤用溫藥而生謂之干黃濕黃則一身盡痛色如黃金樣小便不利四肢沉重渴不欲飲干黃則一身不痛色如橘樣小便自利四肢不沉重渴而引飲陽明則茵陳蒿湯兼太陽麻黃連翹赤小豆湯兼少湯柏皮湯若夫陰證發黃亦當有辨引而伸之觸類而長之可也發斑陰症附條下斑之為病其候至重有下之太早熱氣乘虛入胃而發有下之太遲熱蓄胃中而發有病屬陽用熱過多而發有冬月太暖人受不正之氣至長夏而發凡得此症切不可發汗若誤汗重令開泄更增斑爛必矣在肌葛根橘皮湯在面陽毒升麻湯在身陽毒玄參升麻湯若黑斑非藥所能也辨此證當於胸腹求之若手足之間或有蚊子所齧則難憑據果是斑證病人兩手脈來浮洪緊數必有所苦其斑先紅後赤果是蚊子所齧病人兩手脈來恬靜和緩必無所苦其斑先紅後黃以此求之不能遁其情矣痓病陰痓附條下痓病屬太陽經先曾中風又感寒濕二氣而然大發濕家汗亦致此焉發熱惡寒與傷寒似但項背反強硬口噤如癇狀此為異耳身熱足寒項頸強急惡寒面赤目赤頭搖口噤背反強者屬太陽頭低視下手足牽引肘膝相構屬陽明一目或左右視不正並一手一足搐搦者屬少陽無汗剛痓也大黃加獨活防風湯有汗柔痓也桂枝加川芎防風湯太陽兼陽明防風當歸散所謂汗之止之和之各隨其強此之謂也傷寒治法太陽標病身熱惡寒頭痛腰背強無汗脈來浮緊麻黃湯主之太陽經病與陽明標病鼻乾惡熱不惡寒脈浮而長葛根湯主之太陽經病身熱頭痛項脊強惡寒煩躁飲水脈浮緊大青龍湯主之太陽經病身熱頭痛項背腰脊強惡風心下有水氣而嘔噦脈來浮緊小青龍湯主之以上四條皆表證發汗藥也傷寒五六日胸脅滿痛喜嘔往來寒熱脈弦而數少陽經病也小柴胡湯主之傷寒至十餘日不解胸脅滿痛而嘔少陽經病也日晡潮熱大便結而燥脈數而頗沉大柴胡湯主之目疼鼻乾發熱而不惡寒大渴而大便未結脈浮而長白虎湯主之若脈來長而帶浮背微惡寒無他表證而渴者陽明經病也白虎湯加人參主之傷寒頭痛項背腰脊強惡寒渴而飲水小便不利脈來浮緊太陽本病也五苓散主之以上五條和解藥也身熱鼻乾身重氣短腹滿潮熱不惡寒譫言譫語心下痞胸滿大便難口渴心煩自汗小便赤澀脈沉而疾滑實長大大承氣湯主之身熱鼻乾內熱胃中燥大便不通小便赤澀譫語心下痞而實腹中無轉矢氣脈沉疾而有力小承氣湯主之譫語身熱小便赤澀渴而內熱大便難而不滿腹中有轉矢氣脈沉而疾滑實大調胃承氣湯主之以上三條入里下藥也前此傳陽經之邪用藥法也失治則傳入陰經又具三陰經治例於後腹滿實痛嗌乾手足溫脈沉細實有力桂枝加大黃湯主之口燥舌乾而渴足脛冷脈沉疾有力大承氣湯主之煩滿而囊縮脈沉疾而有力大承氣湯主之以上三條三陰經下藥也心下結硬而痛兼項背強如柔痓狀自汗直視脈沉實而疾大陷胸湯主之心下結硬而痛兼懊憹不寧者心下結硬而痛直至小腹兼舌燥而渴潮熱而煩者心下結硬而痛兼頭汗自出頭以下無之小便不利或發黃者心下結硬而痛兼連胸脅滿痛但微汗出而無大熱者心下結硬而痛兼喘者以上六證俱大陷胸湯主之若非脈沉實而疾與大便閉結用不可行也心下結硬按之而痛兼有熱者小陷胸湯主之心下結痛無熱證而脈弱者此寒實結胸也枳實理中丸主之若脈沉實者三物白散主之以上八條治結胸之藥也心下滿而不痛半夏瀉心湯主之心下痞按之濡關上脈浮而疾兼熱者大黃黃連瀉心湯主之心下痞兼惡寒汗出者附子瀉心湯主之心下痞硬胃中不和兼乾嘔噫食臭脅下有水氣腹中雷鳴下利者生薑瀉心湯主之心下痞硬兼乾嘔心煩不得安者甘草瀉心湯主之以上五條治痞之藥也小便利而赤大便下如豚肝黑色即褐色也其人如狂狀桃仁承氣湯主之小便赤而利其人慾狂大腹滿痛抵當湯主之身黃少腹硬小便自利其人如狂狀身熱而煩喜忘大便黑色有熱小腹滿小便大便自利四證俱抵當湯主之血結胸中心下手不可近為中部蓄血及無寒熱胸滿飲水不欲咽喜忘昏迷如狂二證俱桃仁承氣湯主之以上蓄血下藥也必脈沉疾方可投之胸中痛手不可近實者犀角地黃湯主之若虛不能飲食黃芩芍藥湯加生薑黃耆主之以上必脈虛洪細數方可投之以上七條治蓄血之藥也小便不利四肢沉重似渴不欲飲大茵陳湯主之小便不利發熱而渴茵陳調五苓散主之小便自利四肢沉重渴欲引飲梔子柏皮湯主之寒熱往來一身盡黃小柴胡加梔子湯主之少陽太陽陽明三經合病身熱不去小便自利而煩麻黃黃連連翹赤小豆湯主之將欲發黃急用瓜蒂散搐入鼻中出黃水可也以上六條治黃之藥也傷冷中寒脈弱氣虛變而為陰黃者理中湯加茵陳蒿主之小便不利煩躁而渴茵陳蒿湯加茯苓豬苓滑石當歸官桂主之煩躁喘嘔不渴茵陳蒿湯加陳皮半夏白朮生薑茯苓主之四肢遍身疼者茵陳蒿湯加附子甘草主之肢體逆冷腰上自汗茵陳蒿湯加附子甘草乾姜主之身冷汗不止者茵陳蒿湯加附子乾薑主之服前藥未已脈尚伏者茵陳蒿湯加吳茱萸附子乾薑木通當歸主之以上七條治陰症發黃之藥也若脈微氣弱俱依仲景三經藥方加一味茵陳蒿尤為穩當肌中斑爛多咳而心煩但嘔清汁脈浮洪葛根橘皮湯主之面上斑爛多陽毒已成腰背痛煩悶不安狂言見鬼下利咽喉痛下膿血脈浮大數陽毒升麻湯主之身上斑爛多熱甚煩躁譫語喉痹腫痛陽毒玄參升麻湯主之少陽陽明合病發斑渾身壯熱百節疼痛升麻梔子湯主之通治斑症消毒犀角飲子主之或麻黃葛根湯至穩陰證有斑陰毒升麻鱉甲湯主之大建中湯尤妙以上六條治斑之藥也項背反張口噤發熱無汗反惡寒脈浮緊者各剛痓麻黃如獨活防風湯主之項背反張口噤發熱自汗不惡寒脈浮緩者名柔痓桂枝加川芎防風湯主之汗下後不解乍靜乍躁目直視口噤往來寒熱脈浮弦少陽經病小柴胡加防風湯主之發熱頭面搖卒口噤背反張脈浮長太陽兼陽明病防風兼當歸散主之項背反張脈沉而細口噤太陰痓也心腹痛桂枝加芍藥防風防己湯主之陰痓脈微弱手足厥冷筋脈拘急汗出不止頭脹目搖口噤附子散主之陰痓手足厥冷筋脈拘急汗出不止脈來微細桂心白朮湯主之陰痓閉目手足厥逆筋脈拘急汗出不止脈來微弱附子防風湯主之陰痓一二日面腫手足厥冷筋脈拘急汗不出陰氣內傷脈來微弱八物白朮散主之小續命湯共治痓病之要藥也須看虛實經絡加減用之以上九條治痓之藥也虛邪傳於胸中結痛懊憹不得眠梔子豉湯主之身熱邪氣內傳心中煩而不眠梔子乾薑湯主之以上二條治懊憹之藥也傷寒壞病變證太陽標病中風身熱頭痛項強惡風誤下之前證仍在加以自汗而喘胃氣不和脈浮而弱桂枝加厚朴杏子湯主之太陽標本病頭痛項強自汗惡風身寒脈浮而微誤汗之遂漏不止小便難而清四肢拘急難以屈伸桂枝加附子湯主之太陽標本病頭痛自汗惡風誤下之胸滿脈促前證仍在桂枝加芍藥主之若脈微而遲桂枝去芍藥加附子湯主之傷風誤汗之脈浮而緩反浮而洪自汗用桂枝不能止形似瘧一日再發桂枝二麻黃一湯主之太陽病身熱頭痛脈浮而緊無汗醫發汗過多其人叉手自冒心心悸欲得按者桂枝甘草湯主之傷寒已經發汗表證未除協熱而利其脈尚浮桂枝加人參湯主之太陽病身熱惡風項背強而脈浮誤下之腹滿痛而利桂枝加芍藥湯主之腹滿而痛實不自利桂枝加大黃湯主之太陽標病頭項腰背疼脈浮緊已發其汗多漏不止加喘而無大熱者不可用桂枝宜麻黃杏子甘草石膏湯主之厥陰標病傷寒陰結不大便六七日大下之結已去脈不浮反沉而遲手足厥冷咽喉不利吐膿血利不止為難治也若溫之則咽喉痛唯麻黃升麻湯主之太陽脈浮自汗惡風傷寒誤下之利不止脈浮大而長葛根加黃芩黃連湯主之太陽病傷寒已發其汗而少瘥過經十三日不解胸脅滿而嘔日晡潮熱大便結硬柴胡加芒硝湯主之太陽經傷寒誤下之里未實胸滿氣痞小便清而不利不當渴而湯頭汗出往來寒熱柴胡桂枝幹薑湯主之太陽病傷寒發汗後表解其人臍下悸欲作奔豚也當散之茯苓桂枝甘草大棗湯主之太陽經傷寒吐下後心下逆滿氣上衝胸起則頭眩及脈沉緊而誤汗之以動其經身如振搖桂枝茯苓白朮甘草湯主之太陽經病傷寒傳裡未實反吐下之而不解熱結於內而微惡風脈尚浮白虎加人參湯主之傷寒表未解當汗誤下之利不止心下痞當以理中丸和之與理中丸益甚邪在下焦也赤石脂禹餘糧湯主之傷寒頭痛當以藥汗之誤以火迫切而致亡陽必驚狂起臥不安者桂枝去芍藥加蜀漆牡蠣龍骨救逆湯主之傷寒自汗當與桂枝湯服藥後不解胸中痞氣上衝不得息寸脈浮胸中有寒也瓜蒂散主之傷寒發表攻裡表證解心下痞硬噫氣未除旋覆代赭湯主之陽明經病自汗醫又攻之小便當不利今反自利津液內竭雖大便硬幹燥宜蜜煎導之少陰病下利咽痛胸滿心煩豬膚湯主之少陰病二三日咽喉痛甘草湯主之不愈桔梗湯主之少陰病咽中生瘡言語聲不出者苦參湯主之少陰病咽痛下利脈微白通湯主之利不止厥逆無脈乾嘔者白通加豬膽汁湯主之少陰病四五日腹痛小便不利四肢沉重或咳或嘔真武湯主之少陰病三四日以上經病漸好但心中煩不得臥者黃連阿膠湯主之病人手足厥冷心下滿而煩寸脈作緊瓜蒂散主之厥陰四肢逆冷心下悸者內傷冷水故也茯苓甘草湯主之傷風附傷風面色光澤發熱頭背腰脊疼自汗惡風脈浮緩桂枝湯主之非惡風不可用設在兩疑之間莫若用神術湯主之辨傷寒潮熱形證死訣合汗不汗令病人九竅閉塞而熱悶亂者死合瀉不瀉令病人腹脹滿身虛腫者死合灸不灸令病人陰疝凝待上衝者死不汗強汗令病人鼻塞吐血心肝受損者死不瀉強瀉令病人腸滑者死不灸強灸令病人火氣入腸五臟受邪者死辨外證九候死訣患人頭有汗身體不涼焦躁極者死患人自覺骨髓熱口出氣粗膚虛腫者死患人
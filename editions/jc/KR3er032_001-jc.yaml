見火木香不見火各一兩上為細末酒糊丸如梧桐子大每服五十丸空心酒鹽湯下沉香鹿茸丸百二十八沉香一兩附子炮四兩鹿茸酥炙三兩熟地黃酒洗六兩巴戟去心一兩菟絲子酒浸五兩麝香另研一錢五分上為末煉蜜丸如梧桐子大每服四五十丸空心酒鹽湯下附子理中丸百二十九人參白朮乾薑炒甘草炙附子炮各等分上為末煉蜜丸每一兩作十丸每服一丸用水一盞煎至七分空心稍熱服小菟絲子丸百三十菟絲子酒洗五兩石蓮肉去殼二兩白茯苓去皮一兩山藥炒二兩七錢五分上將山藥除七錢五分為末打稀糊其餘共為細末以山藥糊為丸如梧桐子大每服五十丸空心溫酒鹽湯任服下青州白丸子百三十一南星生用白附子各二兩川烏去皮臍五錢半夏好白者湯泡七兩上為細末以生絹袋盛於井花水內擺出未出者更以手揉令出以渣更研再用絹袋擺盡為度於瓷盆中日曬夜露每旦換新水攪而復澄春五夏三秋七冬十日去水曬乾如玉片碎研以糯米粉煎粥清為丸如綠豆大每服二三十丸生薑湯送下不拘時服如癱瘓風濕用酒送下小兒驚風薄荷湯下三五丸一方加天麻全蠍各制等分為細末用生薑自然汁煮麵粉為丸梧桐子大法同前麝香大戟丸百三十二川楝子酒煮去核訶子去核茴香炮各六兩葫蘆巴四兩大戟制附子炮各五錢麝香一錢另研木香檳榔各一兩上除川楝子一味其餘共為細末將川楝子以好酒二升蔥白七根長四寸煮去核取肉和前藥末杵和為丸梧桐子大每十丸空心薑湯送下感應丸百三十三杏仁湯泡去皮尖肥者二百四十枚百草霜用鄉村人家鍋底上者佳另研細二兩巴豆七十粒去皮心膜油研細如粉乾薑炮一兩肉豆蔻二十個煨木香二兩五錢丁香一兩五錢上除巴豆百草霜杏仁三味外餘四味為細末同研勻用蠟匱先將蠟六兩熔化作汁以重綿濾滓更以好酒一升於銀石器內煮蠟熔滾數沸傾出候酒冷其蠟自浮於上取蠟稱用凡春夏修合清油一兩秋冬用清油一兩半於冷銚內熬令香熟次下酒煮蠟四兩同化作汁就鍋內乘熱拌和前項藥末成劑分作小錠子以油單紙裹衣旋丸服餌每服三十丸空心生薑湯下香連丸百三十四黃連二十兩用吳茱萸十兩二味各以酒拌濕同炒去茱萸木香四兩八錢不見火一方加石蓮肉半斤去殼治噤口痢神效上為末用醋煮麵糊丸梧桐子大每服三五十丸清米飲下勝金丸百三十五常山十兩檳榔十五個用雞心者上為細末用雞卵清丸梧桐子大每服三十丸於發時前一日臨臥用冷酒送下便睡不可吃熱物茶湯之類至四更盡再用冷酒送下二十丸忌一切熱物至日午方可食溫物至晚不拘控涎丸百三十六甘遂去心大戟去皮白芥子主上氣發汗胸脅有冷痰上件各等分為細末糊丸如梧桐子大每服五十丸淡薑湯下食後臨臥服量病人虛實加減丸數一方名妙應丸治驚痰加硃砂為衣痛甚者加全蠍酒痰加雄黃全蠍驚氣痰成塊者加穿山甲鱉甲玄胡索蓬莪朮臂痛加木鱉子霜桂心熱痰加盆硝寒痛加丁香胡椒肉桂三黃丸百三十七黃連去須黃芩炒大黃各等分炮上為細末煉蜜丸如梧桐子每服三十丸滾白水送下草豆蔻丸百三十八草豆蔻麵裹煨澤瀉小便多者減半半夏泡各一兩吳茱萸湯泡焙乾橘紅去白人參白殭蠶黃耆益智仁各八錢生甘草炙甘草當歸身酒洗青皮去穰各六錢桃仁去皮尖七十粒麥糵面炒一兩半神麯炒微黃柴胡脅不痛減半薑黃各四錢上為細末湯浸蒸餅丸如梧桐子大每服三十丸食遠白滾湯送下丁香楝實丸百三十九當歸酒洗附子炮川楝子去核茴香炒各一兩上細切用好酒三升同煮酒盡為度取出焙乾為細末每稱藥一兩再入後項藥丁香木香各五錢全蠍制十三個玄胡索五錢上為細末同前藥末拌勻酒糊丸如梧桐子大每服三十丸或至百丸溫酒送下木香蹋氣丸百四十木香陳皮去白青皮去穰草豆蔻炮蘿蔔子炒胡椒各三錢蠍尾去毒二錢五分上為細末糊丸如梧桐子大每服三十丸食後米飲湯送下中滿分消丸百四十一黃芩去朽細切酒拌炒二次六錢黃連枳實麥麩炒半夏湯泡七次去皮臍五錢厚朴薑製五錢薑黃人參白朮各二錢五分甘草炙豬苓去黑皮各一錢乾生薑白茯苓去皮砂仁各二錢知母去毛酒炒澤瀉陳皮去白各二錢上為末蒸餅作糊丸如梧桐子大每服百丸焙熱白滾湯或淡薑湯送下檳榔丸百四十二檳榔木香各二錢五分枳實麥麩炒醜頭末陳皮去白各五錢上為細末醋糊丸如梧桐子大每服二十丸生薑湯送下厚朴丸百四十三當歸酒洗丁皮各五錢厚朴薑汁製一兩細辛二錢五分人參一錢五分甘草炙五釐上為細末煉蜜為丸如彈子大每服一丸用水一盞煎至六分和滓熱服枳朮丸百四十四白朮二兩枳實麥麩炒一兩上為細末用沸湯泡青荷葉乾者亦可頃間去藥用湯浸晚粳米杵粉以原湯煮糊為丸如梧桐子大每服五十丸多至七八十丸白滾湯送下金花丸百四十五黃連黃芩黃柏去皮山梔仁炒各一兩上為細末滴水丸如梧桐子大每服五十丸熱滾水送下牛膝丸百四十六牛膝去蘆酒洗萆薢杜仲薑汁炒絲斷肉蓯蓉酒浸去甲菟絲子酒浸防風葫蘆巴炒破故紙酒浸炒白蒺藜各等分一兩官桂五錢上為細末酒煮豬腰子丸如梧桐子大每服五十丸溫酒送下腰痛甚者服之尤捷左金丸百四十七黃連六兩吳茱萸一兩湯泡浸半時許焙乾用上為細末粥湯為丸如梧桐子大每服五十丸用白朮陳皮煎湯送下滾白水亦可地芝丸百四十八生地黃酒洗四兩天門冬去心四兩枳殼麥麩炒二兩甘菊二兩上為細末煉蜜丸如梧桐子大每服百丸食後茶清送下肥氣丸百四十九當歸頭酒洗蒼朮各一兩五錢青皮炒一兩蛇含石醋煆淬七錢五分三稜莪朮鐵孕粉各三兩與三稜蓬朮同入醋煮一沸時久上為細末醋煮米糊為丸如綠豆大每服四十丸用當歸浸酒下食遠溫服之痞氣丸百五十赤石脂醋淬火煆川椒炒出汗乾薑炮各二兩桂心附子炮各五錢大烏頭炮去皮臍二錢五分上為細末煉蜜為丸如梧桐子大以硃砂為衣每服五十丸食用清米湯送下補陰丸百五十一黃柏半斤鹽酒拌炒褐色知母去毛酒製炒熟地黃酒洗各三兩龜板酥炙四兩白芍藥煨陳皮去白牛膝酒浸去蘆各二兩虎脛骨酥炙一兩鎖陽酥炙當歸酒洗各一兩五錢上為細末酒煮羯羊肉為丸如梧桐子大每服五六十丸空心鹽湯送下冬月加乾薑半兩滋腎丸百五十二黃柏酒炒陰乾二兩知母酒浸二兩桂去粗皮一錢上為細末熟水丸如梧桐子大每服五十丸空心百沸湯下瀉青丸百五十三當歸酒洗龍膽草川芎山梔大黃羌活防風各等分上為細末煉蜜丸如梧桐子大每三十丸熟滾水送下奔豚丸百五十四厚朴薑汁製七分黃連五錢白茯苓去皮澤瀉去毛菖蒲各二錢川烏炮丁香各五分苦楝酒煮去核三錢玄胡索一錢五分全蠍附子獨活各一錢肉桂一分巴豆霜去油用五分上件除巴豆霜茯苓各另研為末旋入外為細末和勻煉蜜丸如梧桐子大淡鹽湯下初服二丸一日加一丸二日加二丸漸漸加至大便微溏再服二丸起加服之積消而止黃連黃柏知母丸百五十五黃連黃柏知母酒製各等分上為末水丸如梧桐子大每服七八十丸至百丸空心百沸湯送下以飲食厭之二丹丸百五十六治健忘養神定志和血安神外華腠理熟地黃酒洗天門冬去心丹參各一兩五錢茯神去皮心麥門冬一兩去心甘草炙一兩遠志去心人參五錢丹砂另研為衣菖蒲各五錢上為細末煉蜜為丸如梧桐子大每服五十丸或加至百丸空心愈風湯送下平補鎮心丹百五十七白茯苓去皮五味子熟地黃酒洗天門冬去心麥門冬去心肉桂各一兩二錢五分遠志去心茯神去皮心山藥薑汁炒各兩半酸棗仁去殼二錢五分車前子人參硃砂另研各五錢龍齒制一兩五錢上為末煉蜜為丸如梧桐子大硃砂為衣每服三十丸空心用米飲湯或溫酒任下還少丹百五十八川牛膝去蘆酒浸山藥炒各一兩五錢杜仲薑汁炒斷絲巴戟去心山茱萸去核肉蓯蓉酒浸去甲五味子白茯苓去皮小茴香炒遠志去心同甘草煮柏子仁各一兩石菖蒲枸杞子去核各五錢熟地黃酒洗二兩上為細末煉蜜同紅棗肉為丸如梧桐子大每服七十丸用溫酒或鹽湯送下日進三服黑錫丹百五十九黑錫熔化去滓硫黃各二兩金鈴子即川楝子沉香木香附子炮葫蘆巴茴香破故紙陽起石研水飛肉豆蔻炮桂各半兩自金鈴子以下另為末上將黑錫用新鐵銚先熔化以硫黃末一錢和炒黑錫結成砂子再用慢火熔化將所餘藥一兩九錢硫黃黑錫同熔化攪冷勻傾在地坑內出火毒過一夜取出研令極細末又將前項為末和勻一處再研一日成黑光為度酒糊為丸如梧桐子大陰乾入布袋內擦光每服五十七十丸空心姜鹽湯任下或棗湯下婦人醋艾湯送下一方有巴戟金鎖鎮元丹百六十五倍子白茯苓各八兩巴戟去心肉蓯蓉酒浸去甲葫蘆巴炒各一斤補骨脂酒炒十兩硃砂三兩另研龍骨二兩上為末酒糊為丸如梧桐子大每服二十丸空心溫酒淡鹽湯任送下離珠丹百六十一杜仲薑汁炒絲斷破故紙制各三兩萆薢二兩訶子去核五枚龍骨煆巴戟去心各一兩胡桃肉百二十個砂仁五錢硃砂一錢五分另研上為細末酒糊為丸如梧桐子硃砂為衣每服二十丸空心鹽湯溫酒任送下天真丹百六十二沉香巴戟酒浸去心茴香鹽炒去鹽萆薢酒浸炒葫蘆巴炒破故紙杜仲薑汁炒黑醜鹽炒去鹽琥珀各一兩桂五錢上為末用原浸藥酒煮糊為丸如梧桐子大每服五六丸至七八丸空心溫酒送下三才封髓丹百六十三天門冬去心熟地黃酒浸人參各五錢黃柏酒浸炒三兩砂仁一兩五錢甘草炙七錢五分上為末水煮糊丸如梧桐子大每服五十丸用制肉蓯蓉半兩切作片子以酒一大盞浸一宿次日煎四沸去滓送下四白丹百六十四清肺氣養魄中風者多昏冒氣不清利此藥主之白芷一兩白檀一錢五分白茯苓去皮白朮縮砂仁人參防風去蘆川芎香附子炒甘草炙各五錢羌活獨活藿香各一錢五分知母去毛細辛去葉各二錢甜竹葉二兩薄荷三錢五分麝香一分另研牛黃另研龍腦另研各五分上為細末煉蜜為丸每一兩作十丸臨臥嚼一丸分五十次嚼以愈風湯送下煮棗方百六十五甘遂大戟芫花各等分上為末煮棗肉為丸如梧桐子大清晨熱湯送下三十丸以利為度次早再服虛人不可多服

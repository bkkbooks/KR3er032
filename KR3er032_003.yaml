body:
  text: 卷下中風一中風者專主正氣氣虛而痰氣乘之所致也分氣血而治之經云且如舟行於水人遇於風舟漏則水入體湧則風傷按治法治痰先治氣氣順則痰利治風先治血血行風自滅先養血而後去風必用順氣排風等劑如左手脈來無力屬血虛治以血藥倍多右手脈來無力屬氣虛治以氣藥倍多依方隨病制宜無如膠柱鼓瑟而誤察病反嗔制方之不精也祕傳加減省風湯陳皮半夏茯苓甘草羌活防風黃芩白芷白朮紅花有死血者加之上細切作一服用水二盞生薑三片煎至一盞去渣再用木香磨薑汁竹瀝入藥內攪勻服血虛者加當歸生地黃熟地黃去紅花氣虛者加人參黃耆去白芷痰盛者加栝蔞仁枳實大便燥閉脈實者加大黃咬牙閉目者用皂莢末蘆筒吹入鼻內或裝於紙捻沖有嚏者可治否則不治痰盛者重用槌法內吐痰甚良痰大出即蘇量老幼元氣虛實治之凡中風口開手撒眼合遺尿吐沫直視喉如鼾睡肉脫筋痛髮直搖頭上竄面赤如妝汗綴如珠皆為中風不治之證也中風灸法風府二人中一頰車二合谷二各灸七壯中寒二中寒者屬冬時中於寒手足厥冷或腹痛嘔吐甚則暈倒昏迷不省人事脈沉遲無力治宜辛溫之劑大法風中則身溫寒中則身冷者是也祕傳加減理中湯中寒輕者用此方人參白朮乾薑甘草乾葛肉桂陳皮半夏茯苓細辛上細切作一服用水二盞姜三片煎至一盞去渣溫服中寒重者六脈全無或腹痛瀉痢不止加附子如身甚惡寒者加麻黃煨生薑水煎臨服時再加薑汁半盞服其患者皮膚外仍用生薑搗碎炒熱款款尉之良中暑三中暑者即夏時所受三伏火也在天為火在地為暑在人臟為心凡暑氣先中於心脈虛身熱自汗背惡寒毛聳齒燥避暑深堂大廈得此證者名中暑是也行人沖走長途或田野力農卒倒者名中熱是也夫中暑者陰證內傷之為病也中熱者陽證外感之為病也經云治暑當降火宜此飲隨證加減祕傳加減香薷飲香薷白扁豆黃連甘草麥門冬五味子知母陳皮茯苓厚朴上細切用水二盞加薑棗燈芯煎至一盞去渣不拘時冷服身熱者加柴胡嘔者加半夏姜汗渴者加天花粉元氣虛者加人參黃耆小便短赤或澀者加山梔仁澤瀉自汗或水瀉者加炒白朮升麻頭痛者加石膏川芎清暑益氣湯治長夏一切等證白虎湯治暑熱發渴並見卷上湯類益元散治中暑身熱煩渴小便不利等證即六一散五苓散治濕熱發熱黃證並見卷上散類若加茵陳治濕熱發熱黃證最捷若暑濕二邪交病加平胃散名胃苓湯中濕四中濕者須分內外而治也內濕者乃飲食生冷所傷也外濕者皆山嵐露雨水土之氣所中也其人脈俱沉細經云治濕不利小便非其治也祕傳加減滲濕湯蒼朮厚朴陳皮茯苓半夏黃連燈芯上細切作一服用水二盞姜三片棗一枚煎一盞去渣納鹽二字服內濕者食下必嘔吐腹中脹滿小便短赤加山楂枳實黃連炒蘿蔔子外濕者身體必腫痛寒熱往來小便短赤加羌活木通黃芩小便不利者加豬苓澤瀉發黃者專主濕熱所成如盦曲相似蓋濕熱則易為黃矣利小便為上策加茵陳滑石木通豬苓澤瀉山梔黃柏感冒五感風者脈多浮數其證身熱面光有汗惡風鼻塞聲重頭疼涕唾稠黏感寒者脈多浮緊其證身熱面慘無汗惡寒腰背拘急頭項強痛感冒之初治此病者須當診按分別之引方參蘇飲治感風無汗鼻塞聲重頭疼見卷止飲類若冬月外感惡寒無汗咳嗽鼻塞聲重者加麻黃杏仁金沸草表汗散之若春夏秋三季咳嗽有痰者去人參木香加桑白皮杏仁若頭痛兼咳嗽者加川芎細辛若氣促喘嗽不止者加知母貝母若肺寒咳嗽者加五味子乾薑若痰熱者加片芩若胸滿痰多者加栝蔞仁如痰唾如膠者加金沸草若嘔逆者加藿香砂仁若心下痞悶或胸中煩熱或嘈雜噁心或停酒不散者倍乾葛陳皮加黃連枳實若脾泄者加蓮肉白扁豆若似瘧者加草果川芎若鼻衄者加四物湯藿香正氣散治時令不正瘟疫大行感冒等證大腹皮制紫蘇藿香白芷茯苓各六分厚朴制白朮陳皮桔梗半夏各四分甘草炙二分上細切用水二盞姜三片棗一枚煎服羌活沖和湯以代桂枝麻黃青龍各半等湯此太陽經之神藥也治春夏秋非時感冒暴寒頭痛發熱惡寒脊強無汗脈浮緊此是太陽膀胱經受邪是表證宜發散不與冬時正傷寒同治法此湯非獨治三時暴寒春可治溫夏可治熱秋可治濕治雜證亦有神也祕之勿與庸俗知此奇妙耳羌活蒼朮各一錢半防風黃芩川芎白芷甘草各一錢生地黃二錢細辛五分不可多上細切用水二盞姜三片棗二枚煎至一盞槌法加蔥白搗汁五匙入藥再煎一二沸若發汗宜熱服止汗宜溫服若胸中飽悶加枳殼桔梗去生地黃若夏月加石膏知母名神術湯若服此湯不作汗加蘇葉若喘而惡寒身熱加杏仁生地黃若汗後不解宜要服汗下兼行加大黃釜底抽薪之法若春夏秋感冒非時傷寒亦有頭痛惡寒身熱脈浮緩自汗宜實表去蒼朮加白朮汗不止加黃耆即加減沖和湯再不止以小柴胡湯加桂枝芍藥一錢如神以上二證如法治而未愈或合吐或合下更於傷寒論中求之合證若虞機之省括於度發無不中矣凡傷寒傳經之證初得太陽經病惡寒發熱頭項強腰脊痛無汗急用羌活沖和湯表之而愈或諸痛悉除亦不惡寒但發熱不解或微汗濈濈然出此為挾虛證宜用補中益氣湯為主治有汗加桂枝芍藥汗未透脈尚浮緊加羌活蒼朮防風葛根倍升麻柴胡滿悶者去黃耆人參仍頭痛未除加川芎白芷荊芥薄荷細辛葛根若渴加五味子麥門冬天花粉三四日間不宜前藥則以小柴胡湯驗證加減如寒熱脅痛少陽外證悉具只以本方服之若兼腹滿自利已見太陰證而少腸證尤未除者本方中加五苓散名柴苓湯熱甚者去桂倍黃芩渴甚者本方去半夏加五味子天花粉五六日不大便潮熱引飲本方中去人參甘草加芍藥枳殼厚朴大黃甚者加芒硝或用河間三一承氣湯七八日過經不解熱不退或黃連解毒湯涼膈散選而用之或仍以小柴胡湯看證調治而愈或愈後因勞役復熱者仍用補中益氣湯多服數帖自安雖因食復病切不可輕用大黃芒硝之類下之蓋病後氣血大虛若復下之必死慎之慎之上證治法內方悉見前集再不重立此載大略未備治此證者須於仲景傷寒論中熟覽詳究用藥庶無誤矣內傷六內傷者皆由飲食不節起居不時勞役過傷或觸犯賊風惡寒發熱宜察表裡虛實內傷外感之候亦有外感挾內傷有內傷挾外感此撮要言更遍覽東垣論中庶得詳悉大法宜以扶植胃氣為本斟酌用藥毋違東垣之指也引方補中益氣湯見卷上湯類備録加減法若咽乾本方加乾葛若心刺痛乃血澀不足倍當歸若精神短少倍人參加五味子若頭痛加蔓荊子痛甚加川芎頂腦痛加藁本細辛若痰多加半夏貝母生薑若咳嗽春加佛耳草款冬花夏加五味子麥門冬秋冬加連節麻黃久嗽肺中伏火去人參若惡食食不下乃胸中有寒或氣澀滯倍陳皮加青皮木香寒月更加益智草豆蔻夏月加芩連秋月更加砂仁檳榔若心下痞悶加芍藥黃連若腹脹加枳實木香砂仁厚朴寒月加生薑肉桂若腹痛加芍藥甘草有寒加桂心夏加黃芩倍甘草芍藥冬加益智草豆蔻半夏若脅痛或急縮倍柴胡甘草若臍下痛加熟地黃不已乃是寒也加肉桂若大便閉澀加當歸梢大黃若腳軟乏力或痛加黃柏不已更加防己若氣浮心亂以硃砂安神丸鎮之上方加減法是飲食勞倦喜怒不節如病熱中則可用之若未傳寒中則不可用此蓋甘酸適口以益其病耳如黃耆人參甘草芍藥五味子之類是也見脾胃論硃砂安神丸調中益氣湯草豆蔻丸治宿食不消胃口痛枳朮丸治痞滿消食強胃等證並見卷上湯類丸類若元氣虛弱飲食不消心下痞悶本方加橘皮一兩名橘皮枳朮丸若治飲食太過致心腹滿悶不快本方加炒神麯一兩炒麥糵曲一兩名曲糵枳朮丸若破滯氣消飲食開胃進食本方加木香一兩名木香枳朮丸若治因冷食內傷本方加製半夏一兩名半夏枳朮丸若治傷肉食濕面辛辣味厚之物填塞悶亂不快本方加酒炒黃連酒蒸大黃炒神麯淨橘紅各二兩黃芩四兩名三黃枳朮丸保和丸治一切飲食所傷胸腹飽悶不安或腹中有食積癖塊多服日漸消散若脾胃虛者恐不可服山楂肉五兩神麯炒半夏炮去皮各三兩茯苓陳皮去白蘿蔔子炒連翹各一兩上為細末別用生神麯五兩入生薑汁一小盞水調打糊為丸如梧桐子大每三五十丸清米飲湯送下若健脾胃消食積加麥糵面一兩白朮二兩名大安丸一云脾虛者服之虛虛之禍疾如反掌或以四君子等物作湯使送下蓋山楂一味大能克化食物若胃中無食脾虛不運不思食者服之則克伐脾胃之氣故云然也加味二陳湯導痰補脾消食行氣陳皮茯苓神麯炒各七分山楂肉一錢五分半夏泡去皮香附子各一錢川芎蒼朮白朮各八分麥芽面炒砂仁炒各五分甘草炙三分上除神麯麥芽面細研另包余細切作一服生薑三片棗一枚水二盞煎一盞調神麯麥芽面入內攪服木香導滯丸治傷濕熱之物不得施化而作痞滿悶亂不安宜用大黃一兩枳實制神麯炒各五錢白茯苓黃芩黃連去毛白朮各三錢澤瀉木香檳榔各二錢上為細末湯浸蒸餅為丸如梧桐子大每服七八十丸溫滾水食遠送下量強弱加減丸數以利為度加減潤腸丸治傷食心腹痛能潤血燥熱通大便大黃倍加黃芩麻黃郁李仁杏仁去皮厚朴枳殼陳皮去白當歸梢蘿蔔子各等分上為末煉蜜丸如梧桐子大每服百丸食前滾白水送下備急大黃丸治心腹諸卒暴痛食積胸滿下咽氣便速行大黃巴豆去皮油膜乾薑各等分上為細末煉蜜和搗為丸如小豆大每服二丸白湯送下以利為度人參養胃湯治內傷飲食心腹脹痛吐瀉瘧疾初起瘧後調理脾胃蒼朮厚朴陳皮去白甘草炙人參白茯苓半夏去皮草果藿香加砂仁香附子上細切用水二盞生薑三片烏梅一個煎至一盞去滓溫服若痎瘧寒多者加炮附子參苓白朮散治脾胃虛弱飲食不進或嘔吐瀉痢或大病後補助脾胃此藥極妙八參白茯苓白朮乾山藥白扁豆去殼薑汁浸炒各一兩五錢甘草炙薏苡仁炒桔梗米泔水浸蓮肉去心砂仁各一兩若治噤口痢用石蓮肉加石菖蒲一兩有氣更加木香五錢上為細末每服二錢棗湯送下噤口痢用粳米湯休息痢用砂糖湯調送下郁證七郁證者氣鬱而濕滯濕滯而成熱熱鬱而成痰痰鬱而成癖血鬱而成症食鬱而成痞滿丹溪曰氣血沖和百病不生一有怫鬱諸病生焉引方六郁湯解諸郁陳皮去白一錢香附子二錢半夏泡去皮山梔仁炒赤茯苓各七分蒼朮撫芎砂仁炒研細甘草炙各五分上細切作一服用水二盞生薑三片煎至一盞去滓溫服若氣鬱倍香附砂仁加烏藥木香檳榔蘇梗乾薑若濕鬱倍蒼朮加白朮若熱鬱倍山梔加黃連若痰鬱加南星枳殼豬牙皂莢若血鬱加桃仁紅花牡丹皮若食鬱加山楂神麯麥糵面越曲丸解諸郁神麯炒香附童便浸蒼朮川芎山梔仁炒各等分上為細末水丸如緑豆大每服五七十丸食遠溫滾水送下痰飲八痰飲者為患百端夫善治痰順氣為先必兼實脾燥濕王隱君有論丹溪有方治者於此求之庶得詳悉不失醫理之旨矣引方二陳湯見卷上湯類導痰湯治風濕咳嗽等證半夏湯泡去皮二錢南星煨陳皮去白枳殼麥麩炒茯苓去皮甘草炙各一錢生薑五片上細切用水一盞半煎至一盞去滓溫服若久嗽肺燥熱去半夏加五味子九粒杏仁五分加味二陳湯治痰理脾胃陳皮鹽水浸八分半夏薑汁炒一錢五分白茯苓去皮白朮各一錢三分香附鹽水拌炒七分連翹黃芩炒枳實麥麩炒前胡甘草各五分炙栝蔞仁桔梗麥糵炒各一錢上細切用水二盞姜三片煎臨服入薑汁三匙竹瀝一杯服加減清膈化痰丸陳皮去白貝母去心半夏曲天南星湯泡薑汁浸炒白茯苓天花粉各一兩片芩去蘆酒炒香附子童便浸醋炒枳實麥麩炒蒼朮米泔浸去皮炒海石另研各八錢桔梗六錢上為細末燒竹瀝加生薑汁為丸如緑豆大每服九十丸食遠及臨臥滾白水送下加味化痰丸治痰滿胸膈咽喉不利者橘紅去白鹽水洗半夏曲炒各二兩桔梗米泔水浸海蛤粉另研貝母去心栝蔞仁另研如泥香附鹽水炒各一兩片黃芩炒枳殼麥麩炒連翹各五錢訶子去核桔白礬另研各二錢五分上為細末煉蜜入真生薑汁調和為丸如黍稷米大每服四五十丸淡生薑湯送下不可多服恐傷上焦元氣清氣化痰丸治胸膈停痰消飲食理脾胃順氣寬胸解鬱陳皮青皮蘇子香附子各二兩神麯麥芽山楂茯苓蘿蔔子杏仁各一兩南星半夏各四兩以皂角二兩白礬二兩生薑四兩切片同水煮取南星半夏焙乾上為末竹瀝薑汁打糊丸如梧桐子大每服七十丸薑湯下咳嗽九咳嗽者須分春夏秋冬並陰虛火動勞嗽風痰治之春是春升之氣夏是夏火炎上最重秋是濕熱傷肺冬是風寒外感痰嗽者嗽動便有痰出是也勞嗽者盜汗面赤是也火嗽者乍進乍退是也風寒嗽者鼻塞聲重是也祕傳加味二陳湯方見卷上湯類春嗽二陳湯加五味子白芍藥杏仁柴胡黃芩生薑煎服夏嗽二陳湯加黃芩五味子黃柏知母秋嗽二陳湯加蒼朮白朮五味子黃芩杏仁冬嗽二陳湯加桂枝蘇葉細辛杏仁麻黃痰嗽二陳湯加桔梗前胡貝母紫菀白芍藥勞嗽二陳湯合四物湯加杏仁紫菀五味子貝母款冬花若久嗽去款冬花加罌粟殼是治其本也火嗽用石膏杏仁湯石膏杏仁桔梗桑白皮芍藥真青黛貝母栝蔞仁梔子陳皮積殼甘草肺脹嗽用桔梗香薷湯桔梗香薷陳皮枳殼黃芩貝母桑根白皮地骨皮青皮柴胡澤瀉甘草梢天門冬燈芯肺實嗽喘兩寸脈洪而有力者用葶藶桑白皮湯葶藶子桑白皮紫菀茸款冬花石膏杏仁栝蔞仁黃芩陳皮枳殼天花粉桔梗頭白茯苓甘草梢肺虛喘嗽兩寸脈微而無力者用五味子湯五味子人參桔梗上半夜嗽者屬陰虛二陳湯合四物湯加黃柏知母五味子五更嗽者屬陽虛食積二陳湯加枳實神麯山楂凡嗽得出者用半夏嗽不出者去半夏用貝母若干嗽者為最難治瘧證十瘧疾者起於內傷外感無痰不成瘧脈自弦數遲是也治法當看所挾客邪何如若有風散風有寒祛寒有暑消暑有濕除濕有痰治痰有積除積客邪既去寒熱既准然後可截寒來不久則腎虛熱來不久則胃虛若不截止必成勞矣經云先補正氣後退邪氣理之必然祕傳人參鱉甲飲人參鱉甲蒼朮白朮半夏厚朴川芎當歸檳榔青皮甘草炙生薑上細切若日間發者屬陽用酒水各一盞黑豆一撮桃枝頭七個烏梅一個同煎至七分露一宿未發之先去渣空心服若夜間發者屬陰加升麻桔梗若寒多者加桂枝酒多水少若熱多者加柴胡茯苓水多酒少若元氣不足者加升麻若渴甚者加天花粉知母若久不瘥者加常山草果祕傳平瘧飲治瘧不問新久神效檳榔枳殼陳皮甘草炙常山桔梗地骨皮五加皮赤芍藥白茯苓一方無茯苓有草果上細切各等分用瓷碗盛之酒浸露一宿臨發日去渣空心熱服渣仍用酒一盞半煎八分服若寒多倍加檳榔枳殼若熱多倍加陳皮甘草加味小柴胡湯日間發者屬陽本方合四君子湯加川芎葛根蒼朮陳皮青皮用水煎服夜間發者屬陰本方合四物湯加青皮用水煎服人參參胃湯治瘧後調理最妙平胃散加人參茯苓半夏草果藿香生薑烏梅上細切用水煎服如痎瘧寒多者加炮附子泄瀉十一泄瀉者多因脾胃虛弱為飲食所傷及風寒暑濕之氣所襲而成此病治法須分氣虛食積並寒濕火不可一概妄治經云虛者補之寒者溫之濕者利之火者降之食積消之此為大法祕傳加減平胃散蒼朮米泔水浸去皮白朮白茯苓甘草炙陳皮去白砂仁豬苓澤瀉上細切用水二盞加薑棗燈芯煎至八分去滓食遠服若瀉如清水脈來無力者屬寒加炮乾薑肉桂甚不止加製附子若瀉如痢黃赤稠黏或乍瀉口渴脈來無力者屬火加黃連黃芩炒乾姜少許若瀉而腹痛右關脈來有力者屬食積加草果枳實山楂若瀉腹痛或嘔吐者加木香磨薑汁服若瀉小便短赤脈沉者屬濕加滑石燈芯若瀉腹如雷鳴者加煨生薑五大片若久不止者屬脾泄脈來無力加人參黃耆若甚不止者加升麻炒白朮蒼朮溫六丸治泄瀉並痢六一散一料加乾薑五錢一方去乾薑加紅曲五錢名清六丸治證見上上為末炊餅為丸如梧桐子大每服五七十丸米飲湯送下祕傳灸法治吐瀉垂死者灸天樞氣海三穴立已天樞在挾臍二寸氣海在臍下一寸五分痢十二痢者多是濕熱亦有食積者初不可便用止澀之劑宜早據虛實通因通用為先以斷下為後祛外邪分陰陽清積滯淡以滲泄苦以堅之又中間有權變痢久不可下當察證調之此乃概論痢方紛雜治者慎按焉引方感應丸治痢初起祛逐之此通因通用之法見卷上丸類祕傳萬病遇仙丹治一切痢疾並積聚癥瘕男子女人小兒一切腹病惟孕婦不宜服之黑醜一斤取頭末五兩半生半炒用莪朮生用茵陳生用檳榔生用三稜醋浸煮豬牙皂角醋浸去皮核另為末各五錢上為細末將皂角末用水打麵糊為丸如梧桐子大男婦每服三錢小兒每服一錢五分五更初用冷茶送下痢五六次見穢積乃除根忌油膩濕面生冷之物功效不可盡述大承氣湯見卷上湯類初起用之此仲景治痢之法芍藥湯行血則便膿自愈和氣則後重自除此藥是也見卷上湯類香連丸治下痢膿血赤白相雜裡急後重見卷上丸類六一散治痢之聖藥功不能述見卷上散類參苓白朮散治噤口痢一切痢見內傷類保和丸治食積痢濕熱痢看所感作湯送下見內傷類祕傳香連丸治大人小兒一切痢疾黃連二兩以一兩同吳茱萸炒以一兩同砂仁炒凡同炒者不用木香一錢肉豆蔻面炮訶子面炮去核各二錢上為細末醋糊丸如梧桐子大每服二十丸空心服若紅痢甘草湯送下若白痢乾薑湯送下若紅白相雜清米湯送下祕傳和中飲治痢不分赤白新久服之無不效者若發熱噤口不食者慎勿服白朮陳皮去白白茯苓白芍藥各一錢草果去皮七分甘草炙三分陳倉米二錢砂糖二錢烏梅一個罌粟殼醋炙一錢五分上細切用水二盞姜三片棗一枚煎至一盞去滓溫服三黃熟艾湯治熱積臟腑下痢赤色及治傷寒四五日而大小熱痢服諸藥多不止宜服之小兒亦宜黃連黃芩黃柏各七分五釐熟艾一錢上細切用水一盞烏梅二個用水煎服祕傳團魚羹團魚大者一個上一味用水煮去腸甲加生薑七片砂糖一小塊不用鹽醬少入米粉作羹吃一二碗立愈胃苓湯見卷上湯類嘔吐噁心十三嘔吐噁心者宜分氣虛血虛痰火傷食不可妄治經云食頓出者名曰吐食時欲嘔不嘔欲吐不吐名曰噁心食後停寒在膈者名曰傷食若右手脈來無力者屬氣虛有力屬痰火若左手脈來無力屬血虛祕傳加味二陳湯陳皮半夏茯苓白朮甘草上細切用水二盞姜三片棗二枚煎一盞去滓再入薑汁服若氣虛者加人參黃耆若血虛者加當歸若痰火者加薑汁炒黃連黃芩山梔若胃口有痰火者加薑汁炒黃連炒乾姜若挾食停寒者加砂仁枳實山梔薑汁若噁心者加黃連炒乾姜生薑汁若脾胃弱者加砂仁藿香仲景云嘔多雖有陽明證慎勿下思邈云嘔家多服生薑吞酸十四吞酸者飲食入胃不化濕熱所蒸故也法宜溫藥散之若久吞酸不已宜以寒涼藥調治之祕傳加味二陳湯陳皮半夏茯苓甘草蒼朮枳實厚朴黃連黃芩山梔上細切用水二盞生薑三片煎一盞服祕傳正胃丸吳茱萸黃連各一兩上以黃連細切同吳茱萸以井花水浸七日去黃連將吳茱萸焙乾每日清晨服四十九粒米飲湯送下嘈雜噯氣十五嘈雜者似飢不飢似痛不痛主心血虛少痰火所撓而有懊憹不自寧之況者是也其證或兼噯氣或兼痞滿或兼噁心漸至胃脘作痛痰火之為患也治法消其痰降其火健脾行濕是治其本也祕傳加味四物湯治嘈雜主補血當歸川芎熟地黃白芍藥人參白茯苓黃連山梔仁半夏甘草炙上細切用水二盞生薑三片棗一枚煎服若嘈雜心痛加茯神生地黃祕傳加味二陳湯治噯氣主消痰陳皮半夏茯苓甘草黃連黃芩山梔桔梗各以生薑汁炒上細切用水二盞生薑三片棗一枚煎服梅核氣十六梅核氣者咯之不出咽之不下乃厲痰也此積熱過甚使然祕傳加味二陳湯陳皮半夏茯苓甘草黃芩枳殼蘇子桔梗厚朴肉桂少許上細切用水二盞姜三片棗一枚煎臨服薑汁磨木香服之水腫鼓脹十七水腫者皆脾土有虧不能防制腎水以致泛溢於皮表也其證先眼胞上下微腫皮薄而光手按成窟舉手即起滿小便短赤者是也治法須先順氣行水然後實其脾土滋養肺腎以制木火二邪更卻鹽味斷妄想以防助邪而保母氣丹溪有論最詳治者推而求之則達其蹊徑矣祕傳助脾滲濕湯治水腫鼓脹蒼朮白朮人參枳殼枳實黃連山梔厚朴大腹皮蘿蔔子炒豬苓澤瀉上細切用水二盞生薑三片燈芯一握煎再用生薑汁磨木香同服若大便燥結者加大黃微利之若小便不利者加滑石若皮厚氣短飽悶腹腫者為鼓若見臍凸腹露青筋手掌足背俱平者不治丹溪治腫脹大法宜補中行濕利小便以人參白朮為君蒼朮陳皮茯苓為臣黃芩麥門冬為使以制肝木少加厚朴以清腹脹氣不運加木香木通氣下陷加升麻柴胡提之血虛加補血藥痰盛加利痰藥隨證加減用之無不效者虛損十八虛損者內外感損不同甚者色欲所致審知諸損固非專方一劑可以兼治今略據證設方治加謹察用之更當詳於難經機要五臟治法庶幾毋錯引方十全大補湯治氣血俱虛而挾寒者以下五方見卷上湯類四君子湯治氣虛四物湯治血虛八物湯治氣血兩虛補中益氣湯治飲食失節勞役所傷暴傷元氣惡寒發熱證似傷寒者加味虎潛丸人參黃耆白芍藥酒炒黃柏鹽酒炒當歸酒洗山藥炒各一兩鎖陽酥炙枸杞子虎脛骨酥炙龜板酥炙破故紙炒菟絲子鹽酒浸三宿焙乾杜仲薑汁炒斷絲五味子各七錢半牛膝去蘆酒洗二兩熟地黃酒浸四兩上為細末煉蜜和豬脊髓為丸如梧桐子大每服五六十丸空心用溫酒或姜鹽湯送下一法取紫河車即初胎産孩胞衣一具長流水洗淨去筋膜蒸熟同前藥末搗和成劑為丸滋陰大補丸川牛膝去蘆山藥各兩半杜仲薑汁炒絲斷巴戟去心山茱萸去核肉蓯蓉酒浸去甲五味子去核白茯苓去皮小茴香炒柏子仁遠智去心甘草同煮各一兩石菖蒲枸杞子各五錢熟地黃酒浸二兩用懷慶上為細末紅棗肉和煉蜜為丸如梧桐子大每服用七十丸空心淡鹽湯或溫酒送下與上虎潛丸相間服之佳所謂補陰和湯生血益精潤肌膚強筋骨性味清而不寒溫而不熱非達造化之精微者未足以議於斯也祕傳固本牛膽丸固本烏鬚髮功效不能盡述傳者得於京師文選司購費珍價宜祕藏勿輕授人參去蘆天門冬去心麥門冬去心生地黃酒洗熟地黃酒洗當歸酒洗蓮花蕊何首烏赤白相半槐角三月上已採者佳上各等分勿犯鐵器為細末用臘月黑犍牛膽一個將前藥末納入膽內懸於風涼陰處四十九日取出每服二錢空心白酒調下若畏苦就以牛膽汁為丸如梧桐子大每服五十丸空心白酒送下切忌房事蘿蔔辛辣之物若欲多制依前法廣取牛膽修合待用恐春夏制之不及也祕傳一醉不老丹養血消痰烏須黑髮男女皆可服之蓮花蕊懷慶生熟地黃槐角子五加皮各三兩沒石子六個三陰三陽上將前藥用木石杵舂搗碎以生絹袋盛之同無灰好酒十斤入不津埕內春冬浸一月秋二十日夏十日緊封埕口浸滿日取藥滓曬乾搗為細末又用大麥面三兩炒熟和前藥末煉蜜為餅子每餅重一錢又取薄荷為末同前藥餅入瓷罐內一層末一層餅每日飯後取十數餅放在口內待其自化咽下藥酒恁意飲之以醉為度須連日服盡久則恐味變也酒藥服盡而鬚髮白者黑矣若不黑再合二三料服之若餅難噙為丸以酒吞之亦可近見祝公敘云但飲前藥酒亦自見效渣滓不用可也一云生天門冬不拘多寡用滾水泡過去皮心搗爛絞汁以砂鍋盛之用文武炭火煮勿大沸以十斤為率熬至三斤卻入蜜四兩熬成膏滴水中不散取出以瓷罐盛之埋地中七日去火毒每早晚用一匙白湯調下若動大便以酒調服能去積聚風痰補肺療嗽咳失血潤五臟除三蟲伏尸瘟疫輕身益氣令人不飢延年不老抱朴子云杜紫薇服天門冬御八十妾有子一百四十人日行三百里班龍丸治真陰虛慎及老人虛人常服延年益壽鹿角膠炒成珠鹿角霜菟絲子酒浸研細柏子仁熟地黃各半斤白茯苓補骨脂各四兩上為細末酒煮米糊為丸或以鹿角膠入好酒溶化為丸如梧桐子大每服五十丸空心姜鹽湯下昔蜀中有一老人貨此藥於市自云壽三百八十歲矣每歌曰尾閭不禁滄海竭九轉金丹都謾說惟有班龍頂上珠能補玉堂關下血當時有學其道者傳得此方彼老人化為白鶴飛去不知其終祕傳玉液還丹枸杞子五味子覆盆子菟絲子酒浸巨勝子炒去皮生地黃酒洗熟地黃酒洗天門冬去心麥門冬去心人參鍾乳粉鹿茸酥炙甘菊花酒洗肉蓯蓉山藥炒各等分沉香另研為衣上為細末候採降雪丹即室女初行天癸為丸如梧桐子大沉香為衣每服五十丸空心三意酒下若無降雪丹煉蜜為丸亦可祕傳三意酒枸杞子生地黃各半斤火麻子半升蒸上細切用無灰好酒一大壇以生絹盛藥入不津壇內春秋浸十日夏浸七日冬浸半月大補陰丸降陰火補腎水最妙黃柏鹽酒炒褐色知母去毛炒各四兩熟地黃酒洗龜板酥炙各六兩上為細末煉蜜和豬脊髓為丸如梧桐子大每服用五十丸空心姜鹽湯任下六味地黃丸治腎經虛損久新憔悴盜汗發熱五臟齊損瘦弱虛煩骨蒸痿弱下血咯血等證見丸類人參膏補虛羸元氣最捷人參不拘多寡上一味去蘆細切量水於銀石器內慢火煎如稠飴瓷器盛貯每服一二匙空心白湯調服虛損者於卷上腎部證治圖內方按證參考斯不重立勞怯十九勞怯者多由氣體虛弱勞傷心腎則陰虛而生內熱所致主在痰血水火不能既濟故也亦有外感大淫之氣失於祛散以致乘虛入里久不與治遂成勞瘵又有傳疰而得者其脈多弦虛細數治療之法當究其源所受補陰降火為要祕傳加減八珍湯人參白朮茯苓甘草當歸生地黃白芍藥酒黃柏酒知母橘紅桔梗上細切用水二盞煎一盞去滓服若咳嗽者去人參加沙參五味子麥門冬若久嗽者去人參加杏仁罌粟殼若喘者去人參加桑白皮栝蔞仁若胸中滿悶者加制枳實若有痰者加貝母半夏曲若痰中帶血者加紫菀黃芩山梔若吐血咳血者加山梔阿膠胡黃連若遺精者加牡蠣粉若盜汗者加黃耆半夏曲浮小麥若日晡及半夜熱者加地骨皮若骨蒸勞熱者加秦艽若寒熱往來者加柴胡若心下驚悸去茯苓加茯神遠志若聲嘶及咽痛生瘡者加青黛犀角桔梗若渴甚者去芍藥加天花粉若元氣不足大便溏者加升麻炒白朮若作丸劑加酥炙龜板若遺精加樗根白皮為細末煉蜜為丸如梧桐子大每服五十丸空心鹽湯溫酒任下祕傳秋石丹治勞怯併火證極效用童便一大缸以新水一半攪和候澄清闢去清者留濁腳又入新水同攪候澄去清者再入搗碎雪梨二十個又入甘松半斤熬水一小桶同攪以白綿布一方濾去渣滓候澄清闢去清者留濁腳曬乾為細末羅淨每服一小匙燒酒送下用瓷罐盛貯封固勿令泄氣勞怯者內經有曰陰虛生內熱究斯一言便知治法之大意也忱每見得此證者多因咳嗽唾痰咯血吐血身熱脈弦虛細數頰赤唇紅貌黃體瘦是皆嗜欲過淫勞怯之所由也嗚呼人之有生色欲不免夫何耽樂忘返昏於怯心不思真元之虧耗以至於甚哉所感病有輕重之殊死在姑延歲月真病既出雖費千金求療復生者幾希矣仙翁有詩云可惜可惜真可惜世間有寶人不識真精噴與粉骷髏卻去街頭買秋石斯言至矣信之念之易曰君子以懲忿窒欲此之謂歟或曰汝何不詳具治法而諄諄切於示戒豫曰經云不治已病治未病之意也豫承其旨因附言於方左以自警並告諸同志云頭痛二十頭痛者非止一端大概多由風寒所襲故經曰風從上受之然亦有熱有氣虛有血虛有胸膈停痰厥氣壅逆而痛者須先調治痰厥又有腎虛氣厥而巔頂痛者謂之腎虛頭痛或發時左右頸後筋緊掣痛應於巔頂甚不可忍治法用艾灸百會囟會風池等穴效應尤速或用燈芯草尋刺腦後動跳脈按法隨用醫者更宜究東垣六經頭痛論治理了熱引方加味調中益氣湯治氣血兩虛頭痛其效如神陳皮酒黃柏蔓荊子各三分升麻柴胡各四分人參甘草炙蒼朮川芎各六分黃耆一錢細辛二分當歸五分上細切用水二盞煎服一方有木香二分無黃柏祕傳加減川芎茶調散治頭風熱痛不可忍者片黃芩二兩酒拌炒再拌再炒如此三次不可令焦小川芎一兩白芷五錢芽茶三錢荊芥四錢薄荷葉二錢五分上為細末每服二錢茶清或滾白湯調送下徹清膏治頭痛風熱耳聾見卷上飲類心痛二十一即胃脘痛心痛者雖有九種溯其由則皆憂鬱內傷邪氣外感結聚痰飲停於脾胃溢於包絡所致其有寒氣鬱於胃口者有熱傷死血者有食積者有痰飲作痛者須各宜辨之又有真心痛者則手足皆青旦發夕死夕發旦死不可治也祕傳加減調中湯蒼朮厚朴陳皮甘草枳實桔梗白茯苓草豆蔻建寧者佳上細切用水二盞姜三片煎一盞去滓再入木香磨薑汁服若寒痛者脈必無力加乾薑肉桂若熱痛者脈必有力加生薑汁炒黃連黃芩止梔若食積痛者加炒砂仁草果山梔若痰飲作痛者加半夏曲栝蔞仁若日輕夜重者屬死血加當歸尾桃仁紅花玄胡索祕傳加味枳朮丸治清痰食積酒積茶積肉積在胃脘當心而痛及痞滿噁心嘈雜嘔吐等證白朮三兩枳實麥麩炒蒼朮米泔水浸二宿豬苓去皮麥糵面炒神麯炒半夏湯泡透各一兩澤瀉去毛赤茯苓去皮川芎黃連陳壁土炒去土白螺螄殼煆各七分草豆蔻砂仁炒黃芩陳壁土炒去土青皮去白蘿蔔子炒乾生薑各五錢陳皮去白香附子童便浸栝蔞仁厚朴薑汁製炒檳榔各三錢木香甘草各二錢若久病挾虛者加人參白扁豆石蓮肉各五錢若吞酸者加吳茱萸湯泡寒月五錢熱月二錢五分若時常口吐清水加炒滑石一兩牡蠣粉五錢上為細末用青荷葉泡湯浸晚粳米搗粉作糊為丸如梧桐子大每服用七十丸多至一百清米飲湯送下祕傳靈脂遏痛湯治婦人血刺痛當歸酒洗赤芍藥五靈脂醋炒香附子醋炒木香艾葉醋炒陳皮去白半夏香油炒枳殼厚朴蘇梗木通上細切用水二盞生薑三片煎至一盞去滓服心痛者於內傷方求之治同斯不重立腹痛二十二腹痛者須分寒熱食積濕痰死血診按病由調治若綿綿痛者屬寒若忽痛忽止者屬熱若便後痛少減者屬食積若小便不利而痛者屬濕痰若日輕夜重作痛不移動者屬死血祕傳加減調中湯蒼朮厚朴陳皮甘草半夏白茯苓木香砂仁枳殼各等分上細切用水二盞生薑三片煎再入木香磨薑汁調服若寒痛者加乾薑肉桂甚不已加製附子若熱痛者加生薑汁炒黃連黃芩去木香若食積痛者去枳殼加枳實草果大黃下之若痛甚不已者加柴胡大黃微利之此痛隨利減之法若濕痰痛者倍加蒼朮半夏砂仁若死血痛者去蒼朮半夏砂仁加當歸桃仁紅花重者再加大黃若小腹痛者加青皮凡諸腹痛勿用參耆朮蓋補其氣氣旺不通而痛愈甚凡諸腹痛甚者脈必沉伏凡諸腹痛面上忽見紅斑點者多死腹痛者如以上法治而未愈更於內傷方求之治同或合消或合下腰痛二十三腰痛者男子多因腎虛女人多因瘀血蓋由腎經虛損而外為四氣所襲內為七情鬱結而成又有墜墮閃肭氣血凝滯而痛者其脈多沉弦治法云虛者補之風者敗之寒者溫之挫閃者行之瘀血者逐之濕痰流注者消導之宜各類推而治之不可執一論也引方獨活寄生湯治因腎虛坐臥冷濕當風所得獨活一錢桑寄生杜仲炒絲斷細辛牛膝秦艽茯苓白芍藥桂心川芎防風甘草炙人參熟地黃當歸酒洗各五分上細切用水二盞煎至一盞去滓空心溫服青娥丸治腎虛腰痛常服壯筋補虛方見卷上丸類牛膝丸治腰胯痛方見卷上丸類摩腰丹治寒熱腰痛並老人虛人腰痛附子尖烏頭尖南星各二錢五分硃砂乾薑各一錢雄黃樟腦丁香各一錢五分麝香當門邊取五粒或加吳茱萸桂皮上為細末煉蜜為丸如龍眼大每用一丸生薑汁化開如厚粥樣烘熱置掌中摩腰上令盡黏著肉烘綿衣縛定腰熱如火間三日用一丸妙腰痛者若因房勞辛苦而痛者用四物湯加黃柏知母五味子杜仲之類吞補腎丸或大補陰丸若因風寒濕流注經絡而作痛者用二陳湯加麻黃蒼朮川芎白芷防風羌活獨活之類若因銼閃跌撲致死血流於本經而作痛者用四物湯加桃仁紅花蘇木之類脈實人壯盛者用大承氣湯加桂下之若因醉飽入房太甚而醉食之積乘虛流入於本經致腰痛難以俯仰用四物湯合二陳湯加麥芽神麯杜仲黃柏官桂砂仁葛花桔梗之類灸法取腎腧二穴灸之尤捷腎腧穴在脊中對臍各開寸半是穴氣證二十四氣證者起於七情觸發怒氣傷於肝經凡氣有餘即成火雖氣無補法實者固不宜補虛者或少補之不為常例祕傳木香化氣湯氣實者用之蒼朮厚朴枳殼陳皮青皮大腹皮木香砂仁黃芩紫蘇子香附子上細切用水二盞姜三片煎一盞去滓服若脅痛者加柴胡青皮若小腹痛者加青皮祕傳補中參朮湯氣虛者用之人參白朮甘草當歸白茯苓蒼朮厚朴陳皮枳殼少許上細切用水二盞姜三片棗二枚煎一盞去滓服若婦人加香附木香磨水調服疝氣二十五疝氣者內經曰肝脈大急沉皆為疝又曰三陽急為瘕三陰急為疝難經曰任脈之為病其內苦結男子為七疝夫所謂七疝者寒水筋血氣狐㿗七者是也醫者宜分別七證而治之祕傳馬藺花丸治七疝㿗氣及婦人陰㿗墜下小兒偏墜等證無有不效者馬藺花醋炒川楝子橘核海藻海帶昆布三味俱鹽酒洗桃仁去皮尖各一兩厚朴薑汁製木通枳實麥麩炒玄胡索肉桂木香檳榔各五錢脈沉細手足逆泠者加川烏頭一個炮五錢上為細末酒糊為丸如梧桐子大每服五七十丸或酒或姜鹽湯任意送下凡治七疝須先灸大敦穴一名大順在足大拇指離指甲如韭葉大灸三壯乃足厥陰井也痛風二十六痛風者肥人多因風濕瘦人多因血虛大率痰熱所作今列數方於左當察受病之原選而用之祕傳飛步丸治諸風濕癱瘓痛風等證服此藥須忌熱物蒼朮八兩草烏不去皮尖四兩川芎白芷各二兩蔥白連根生薑各四兩上細切作一處入罐內封固罐口倒覆陰土地上在春停五日夏三日秋七日冬十日取出前劑曬乾為細末醋糊為丸如梧桐子大每服十五丸空心茶酒任下宜避風孕婦勿服祕傳烏藥順氣散此方得於河南王府購費重價烏藥川芎熟地黃酒洗防風枳殼去穰麥麩炒桔梗白芷姜蠶湯洗淨薑汁炒羌活當歸酒洗白芍藥木瓜檳榔南木香秦艽各一兩川獨活甘草各五錢上細切以生絹袋盛藥同無灰好酒二十五斤入不津壇內春冬浸一月秋二十日夏十日緊封壇口浸滿日取酒將吞捉虎丹隨量飲之如飲過一半再添酒連絹袋煮熱飲之須忌食豬肉若妊娠婦不宜服捉虎丹祕傳捉虎丹治風寒暑濕腳氣無問遠年近日一切走注痛風及中風左癱右瘓筋脈拘急麻痹不仁手足不能屈伸日夜作痛叫呼不已麝香二錢五分京墨燒煙盡一錢五分乳香沒藥各七錢五分草烏去皮臍五靈脂地龍去泥淨木鱉子去殼油白膠香各一兩五錢當歸酒洗七錢五分上各為細末再羅過和勻用糯米糊為丸如芡實大臨發時空心用前藥酒送下一丸或三丸趕到腳面上赤腫不散再服一丸趕至腳心出黑汗乃除根凡服察病患上下飢飽服俱用前藥酒送下自然汗出定痛為驗若中風不省人事牙關緊閉偏枯等證研二丸酒調下一省為驗祕傳加味二妙丸治兩足濕痹疼痛或如火燎從足跗熱起漸至腰胯故麻痹痿軟皆是濕為病蒼朮米泔水浸四兩黃柏酒浸炒二兩川牛膝去蘆當歸尾酒洗川萆薢漢防己龜板酥炙各一兩虎骨酥炙一兩上為細末酒煮麵糊為丸梧桐子大每服百丸空心薑湯下祕傳愈瘋丹治一切風疾偏正頭風半身不遂常服調理並治諸惡瘡毒赤白痢疾痛風等證防風去蘆連翹麻黃去節黃連酒妙黃柏酒炒各五錢川芎川歸酒洗赤芍藥酒浸薄荷葉石膏桔梗何首烏熟地黃酒洗羌活細辛此味辛宜減半甘菊花天麻各一兩黃芩一兩五錢白朮荊芥穗各二錢五分山梔仁七錢五分滑石五兩另研甘草炙二兩殭蠶炒五錢熱甚加大黃朴硝各一兩上為細末煉蜜為丸如彈子大以硃砂金箔為衣每服一丸細嚼用茶清或酒送下祕傳風藤造酒方真風藤金銀花各七錢當歸酒洗芍藥男用白芍女用赤芍防風白芷何首烏羌活獨活上為細末用糯米一斗蒸熟將前藥末並曲拌勻如常釀酒法酒或入瓶內煮熟泥固瓶口頓七日取用每日分早午晚飲一鍾隨量多寡為則察病患飢飽服當歸拈痛湯見卷上湯類阿魏萬靈膏見瘡瘍類目病二十七目病者雖有七十二證之殊然皆不過風熱憂鬱之所為四氣七情之所致也治宜清熱養血為當祕傳當歸地黃湯當歸生地黃川芎赤芍藥甘菊花龍膽草防風黃連知母柴胡陳皮甘草上細切用水二盞芽茶一撮燈芯三莖煎一盞去滓食後服祕傳明目補下丸此方得於京師購費珍價人參三錢五分川楝子酒煮去核遠志去心各一兩半川巴戟去心菟絲子酒浸麥門冬各一兩白朮白茯苓去皮赤芍藥酒浸青鹽破故紙炒小茴香葫蘆巴肉蓯蓉酒洗黃耆甘草炙枸杞子砂仁炒黃柏鹽酒炒山藥炒知母去毛皮鹽酒炒熟地黃酒洗懷慶五味子蓮肉去心各五錢車前子二錢五分上為細末酒煮糯米糊為丸如梧桐子大每服八九十丸空心用鹽湯送下祕傳開明銀海丹治一切風熱上壅兩目赤腫澀痛風弦爛眼及內外翳障等證白爐甘石一兩以炭火煆三炷香候先以黃連半兩煎濃汁濾去滓淬七次細研辰砂一錢硼砂二錢輕粉五分片腦三分多則五分麝香一分若赤眼腫痛加乳香沒藥各五分若內外翳障加珍珠五分鴨嘴膽礬熊膽各二分若爛弦風眼加銅青飛丹各五分或以諸藥總合為一治諸般眼疾上各研為極細末一處和勻再研一二日無聲銀瓶盛貯蜜蠟封口勿令泄氣點眼極妙因調西江月以誦揚之體具全恁銀海百年惟喜光明苟因失慎致盲昏或是風疼翳釘傳得真方祕訣豈同售藥虛名略將簪杪點眸睛立效渾如響應祕傳點眼光明丹黃連半斤煎汁濾淨爐甘石一斤用紫罐盛煆三炷香時入黃連汁內七浸七暴隨時聽用爐甘石制過一兩麝香鵬砂各一分片腦二分枯白礬五釐若風眼加五倍子火煆存性用一分上研為極細末用骨簪杪沾水蘸藥點眼內閉目咽喉二十八咽喉者雖有喉痹喉癰喉風單蛾雙蛾重舌木舌之不同然皆風熱所生也亦皆相火之所沖逆耳經曰一水不勝二火火者痰之本痰者火之標火性急速故病發暴悍而喉熱證作矣間有腑寒喉縮伏如物梗痛癢多涎者亦有七情鬱結咽中有物如梅核吞吐不得者須各究其源治之祕傳清咽散治咽痛並口舌生瘡荊芥薄荷防風桔梗山梔連翹玄參大力子片芩生甘草若熱甚加殭蠶犀角上細切用水二盞煎一盞去滓服涼膈散治咽痛退六經熱極妙方見卷上散類祕傳梨汁飲治喉痹及喉中熱痛口舌生瘡等證極妙用好消梨杵汁頻頻飲之若患者能自嚼咽下亦可多食妙大解熱毒惟金瘡産歸及諸脫血證勿食其餘一應癰疽發背等證多食極妙祕傳洞關散治喉癰等證珍珠五分牛黃片腦麝香各三分硃砂一錢上研為細末用少許吹入喉中立已四七湯加桔梗枳實治七情所致咽痛者方見卷上湯類祕傳加味二陳湯治七情鬱結咽中如梅核吞吐不得者方見梅核氣類凡治諸骨鯁喉宜研萱草根順流水吞下若魚骨鯁喉者宜食橄欖即下或用其核為末順流水下若獸骨鯁喉者磨象牙水咽下祕傳蒲黃散治舌腫大塞口不通飲食者用蒲黃一味真者羅淨頻刷舌上其腫自退若能咽藥即以黃連一味煎濃汁細細呷之以瀉心經之火則愈齒病二十九齒病者腎之標繫於手足陽明乃胃與大腸之脈貫絡也有腎元虛者治宜滋陰補腎有胃中有火者治宜安胃瀉火有風痰上攻者治宜祛風導痰有蟲蝕者治宜擦牙誅蟲故其疼不一治者須究其源以療之祕傳寧口散治牙疼牙疳口舌生瘡咽喉腫痛等證青黛二錢硼砂一錢孩兒茶薄荷葉各五分片腦二分上為細末以筆尖醮藥點患處咽疼用蘆管吹入一方加蒲黃朴硝生甘草各等分片腦少許治口內諸病祕傳愈剛散治風蟲牙疼白芷光烏威靈仙真川椒等分上為細末擦疼處立已須先用防風荊芥芫花蒼耳子白蒺藜真川椒小麥各等分水二盞煎去滓含漱疼處再擦尤捷祕傳加味涼膈散治胃有實熱齒疼者方見卷上散類本方用大黃酒蒸為君加知母石膏升麻為佐水煎徐服祕傳神應散治牙疳神效蝦蟆一隻小者背緑眼光者是用明礬二錢小紅棗二枚去核上共搗成膏作一丸火煆存性為細末筆尖蘸藥點患處祕傳烏須萬應散擦牙自堅須自黑其他亦自得也用沒石子四錢破故紙細辛熟地黃酒洗各一兩半青鹽地骨皮二兩上為末每用一錢空心擦牙咽下血證三十血證者脈多芤而微細者可治芤而滑大者難治其證大概有二有血熱鬱血溢有氣鬱血溢然見血又有上中下三部之分衄唾嘔吐為上部皆火載血上錯經妄行血結胸中為中部膀胱蓄血及溺血為下部其間不出風熱壅遏憂思鬱結而然是以從肺而上溢於鼻者曰衄血從胃而上溢於口者曰嘔血夫所謂咯血唾血者出於腎也咳血嗽血者出於肺也又有痰帶血絲出者或從腎或從肺來也其血出於小便者曰溺血曰血淋出於大便者曰腸風痔血治法當求其本祕傳加減八味湯治衄唾嘔吐血當歸生地黃赤芍藥阿膠珠牡丹皮黃連黃芩山梔人參甘草犀角京墨上細切用水二盞茆根一握搗爛棗二枚煎去滓磨京墨犀角調服若痰中帶血者加知母若血疙瘩者加紅花桃仁炒乾姜若凡人暴吐紫血一二碗無事吐出為佳與前藥治之若後見脈大身熱必難治矣祕傳加減芩連四物湯治大小便血黃芩黃連當歸生地黃白芍藥山梔陳皮白朮人參甘草上細切用水二盞生薑三片棗一枚煎一盞去滓溫服若溺血者加黃柏知母滑石若下血及腸風臟毒者加黃柏子芩槐角阿膠防風荊芥祕傳發灰丸治溺血頭髮不拘多少燒灰存性用壯年無病者佳上為細末別用新採側柏葉搗汁調糯米粉打糊為丸如梧桐子大每服五十丸空心白滾湯下或煎四物湯送下祕傳竹葉灰丸治下血䈽竹葉不拘多少燒灰存性上為細末用米糊為丸如梧桐子大每服七八十丸空心清米飲湯送下一方以鵝卵殼為末米飲湯下一匙一方以乾柿餅燒存性為末用清米飲湯調下二三錢立已灸法治下血無度灸脊中對臍一穴永不再發祕傳治腸風下血丸乾柿餅燒灰存性酒瓶箬包酒過二三年者燒灰存性烏梅肉燒灰存性各二兩淨百藥煎一兩如無以五倍子炙焦黃色代之槐花炒焦黑枳殼麥麩炒黃色檳榔各半兩上為細末醋糊為丸如梧桐子大每服七八十丸醋湯下汗證三十一汗證者有二本之殊其自汗者無時而濈濈然出動則為甚屬陽虛胃氣之所司也治宜補陽調衛為當其盜汗者寐中而通身如浴覺來方知屬陰虛榮血之所主也治宜補陰降火為要醫者宜詳辨而推治之祕傳加味四君子湯治自汗者人參白朮茯苓甘草川歸生地黃黃柏黃連黃耆桂枝少許大棗一枚上細切用浮小麥一撮水二盞煎一盞去滓服祕傳加味四物湯治盜汗當歸川芎熟地黃生地黃白芍藥人參白朮黃耆黃柏知母上細切用浮小麥一撮棗一枚水二盞煎一盞去滓服心跳驚悸三十二心跳者屬血少如魚無水也治宜補血心驚者心下悸動有水飲如人將捉捕也祕傳加味四物湯治心跳當歸川芎熟地黃遠志白芍藥人參甘草茯神山梔上細切用水二盞煎一盞去滓服祕傳加味四物湯治心驚當歸川芎熟地黃白芍藥白朮人參甘草豬苓澤瀉上細切用水二盞煎一盞去滓服祕傳金箔鎮心丸治憂愁思慮傷心令人惕然心跳動驚悸不安等證川歸身酒洗生地黃酒洗遠志去心茯神各五錢石菖蒲九節者用黃連各二錢五分牛黃一錢另研辰砂二錢另研金箔十五片上以前六味研細入牛黃辰砂二味末子豬心血丸如黍米大金箔為衣每服五十丸煎豬心湯送下消渴三十三消渴者多因快欲恣情服食丹石耽酗醇酒甘嗜炙爆遂使相火燔熾真水耗竭而成是故患者心脈多浮腎脈多弱治法當以瀉火潤燥清心滋腎為先須分上中下三焦為治若熱在上焦舌赤唇紅煩躁引飲若熱蓄中焦消穀易飢引飲倍常大便硬小便數若熱伏下焦陰強失精精竭引水小便如膏是也祕傳黃連地黃湯黃連生地黃天花粉五味子川歸人參乾葛白茯苓麥門冬甘草上細切加生薑一片棗二枚竹葉十片用水二盞煎去滓溫服若上焦渴者加桔梗山梔若中焦渴者加黃芩若頭眩渴不止者加石膏若下焦渴者加黃柏知母若作丸劑加薄荷煉蜜為丸如彈子大噙化咽下便濁遺精三十四便濁遺精者皆由思慮過傷色欲不節心腎虛勞水火不交之所致治法當以清心腎為先補陰降火為要其因夢與鬼交而泄謂之夢遺若不因夢交或隨溲溺而出謂之精滑祕傳補陰湯治便濁遺精並女人白帶黃柏知母當歸熟地黃人參白朮白芍藥山梔仁黃耆蓮肉陳皮白茯苓上細切用水二盞生薑一片棗二枚煎一盞去滓服若作丸劑加樗根白皮為細末煉蜜為丸如梧桐子大每服五七十丸空心淡鹽湯送下淋閉三十五淋者其名有五本屬於熱經云清陽出上竅濁陰出下竅故清陽不升則濁陰不降而成淋閉之患矣先儒以滴水器上下竅譬之甚當蓋淋者欲通不通不通忽通者是宜除其熱泄其閉塞清肅肺金以滋膀胱腎水之下元此治淋之正法也祕傳通塞散治小便淋閉莖中作痛石葦去毛滑石瞿麥萹蓄冬葵子木通王不留行地膚草各等分上研為細末每服三錢滾白湯調送下清心蓮子飲治上盛下虛煩渴小便赤澀成淋黃耆石蓮肉白茯苓人參黃芩甘草炙地骨皮麥門冬車前子上細切用水二盞煎一盞去滓服若發熱加柴胡薄荷導赤散治小便淋閉赤澀六一散治小便淋閉赤澀不通五淋散治小便熱痛如沃湯並見卷上散類祕傳木通湯治孕婦轉胞並男子小便不通冬葵子半兩山梔仁半兩炒研木通三錢滑石半兩研上細切作一服用水一盞半煎八分溫服外以冬葵子滑石梔子為末田螺肉和搗成膏或用生蔥汁調貼臍中立通祕傳治血淋方側柏葉藕節車前草各等分上以三味同搗取自然汁調六一散三錢服之祕傳發灰丸治溺血方見血證類祕結三十六祕結者或因房勞過度飲食失節恣飲酒漿過食辛熱其間種種不同固難一類而推慎勿以巴豆牽牛等峻劑攻下雖暫通快必致再結愈甚治者須知西北人以開結為主東南人以潤燥為要姑撮其略以俟詳究加減潤腸丸木香導滯丸備急大黃丸見內傷類蜜導法用蜜一合微火煉不住手攪勿令焦滴水成珠為度下皂角末再攪捻作鋭子如小指大約入穀道即通吹油法用香油令侍婢口含以小竹筒一個套入肛門以油吹入肛內須臾即通一方以牙皂莢為末投炭火上置桶中令患者坐熏入肛內即通黃疽三十七黃疽者皆因濕熱鬱積於脾胃之中其症有五丹溪云不必分五同是濕熱濕在上宜發汗濕在下宜利小便或二法並用使上下分清其濕學者詳之引方茵陳四苓散治諸疸茵陳茯苓澤瀉豬苓白朮各等分上細切用水二盞燈芯一團煎一盞去滓不拘時服祕傳褪金丸治黃腫絶妙之劑須煎胃苓湯送下蒼朮米泔水浸白朮各二兩半甘草炙半兩厚朴薑汁炒一兩陳皮去白神麯炒黃色麥糵曲炒各兩半針砂醋炒紅色香附童便浸各六兩若有塊加三稜醋煮莪朮醋煮各兩半上為細末用麵糊為丸如梧桐子大每服五六十丸生薑鹽湯送下忌魚腥濕面生冷水果等物祕傳茵陳散治黃疸通用大田螺一個連殼山梔子七個研菲菜根七個茵陳真者一大撮上共搗爛以滾白酒大盞投之攪勻去滓頓服其黃立退祕傳灸法取至陽穴灸之妙至陽穴在脊中第七椎節下痔漏三十八痔漏者皆腸胃蘊熱而成丹溪云專以涼血為主其理治本固當常見人服涼血內劑未獲全效切不宜用腐肉藥取痔多致殞命今得試驗一法具列於後祕傳隔礬灸法治痔漏神效此方購費珍價皂礬一斤用新瓦一片兩頭用泥作一壩再用香油刷瓦上焙乾再著皂礬放在瓦上微火煆枯去砂研末穿山甲一錢入紫罐內煆存性取出研末小鱉子如前法去殼火煆二錢五分淨研末乳香沒藥各一錢五分研末臨灸時加入上件共和勻一處以冷水調量瘡大小作餅子貼瘡上用艾炷灸三四壯灸畢就用熏洗藥先熏後洗每日六度三五日如前法灸妙以瘥為節祕傳熏洗方煎法灸畢以此方熏洗此方購費珍價皂礬製法如前為末約手規二把知母四兩焙乾為末取一兩淨貝母四兩為末取一兩淨蔥七莖上件先將蔥用水煎三四沸傾入瓶內再入前藥令患者坐於瓶口熏之待水溫傾一半洗瘡處留一半俟再灸復熱熏洗以瘥為度祕傳滌風散治痔漏及一切瘋證此方購費珍價川烏草烏併火炮去皮尖蒼朮米泔浸各四兩人參白茯苓各二錢兩頭尖二錢殭蠶七錢用紙隔炒甘草炙三兩白花蛇酒浸三日棄酒火炙去皮骨用石斛酒浸各一兩川芎白芷細辛當歸酒洗防風麻黃荊芥全蠍新瓦上焙乾何首烏米泔水浸忌鐵天麻藁本各五錢上為細末每服三分或五分臨臥酒調服下輒服同前若不用酒者茶清調服忌多飲酒並一切熱物祕傳熏洗方治痔漏神效黃連黃柏蒼朮荊芥枳殼防風苦參玄明粉各等分上細切加過冬藤一握水四五碗煎至桶中先熏後洗瘡瘍三十九瘡瘍者有在表在裡之不同在表者其脈浮洪焮腫在外治法當先內托使邪毒外散如千金托裡散敗毒散之類是也在裡者其脈沉實發熱煩躁當先內疏如栝蔞散連翹散內疏黃連湯之類是也若外無焮惡之氣內已臟腑宣通此為內外之中當和其榮衛如十宣散復煎散之類是也祕傳一捷法治發背癰疽疔腫瘰癧便毒等瘡初起十日內焮赤腫痛宜發散先服羌活保生湯外用圍藥解和散次服一味妙濟飲或榮衛返魂湯如虛弱人宜復煎散當自消退如日久將膿者服妙劑飲不消服真人活命湯入散毒散和服之追膿從大便出如膿已成將潰者用三稜針刺破入拔毒藥線次日膿滿放出再換內入膿盡洗去圍藥用千捶膏貼護風拔毒收口如臟已潰日久臭腐未肯收斂者用除舊布新之法俗人用刀割去腐肉傷人只用拔毒丹末藥津調敷瘡口外用烏金紙黏封自然腐化矣須先用川椒湯或濃茶洗淨然後敷藥外用圍藥塗之再洗如前圍敷待膿盡腐去方用生肌散外摻內服十全大補湯祕傳羌活保生湯羌活獨活防風荊芥連翹黃連白芷柴胡木通陳皮桔梗甘草上細切用水酒各一盞煎至一盞去滓察病上下服祕傳真人活命湯當歸尾二錢穿山甲炒金銀花皂角刺陳皮各二錢五分防風貝母白芷各一錢五分乳香五分另研沒藥一錢另研甘草五分上細切用水酒各一盞煎去滓入乳香沒藥和服得微汗良祕傳敗毒散穿山甲火煆存性或炒一兩白芷五錢一半生一半炒川大黃五錢一半生一半煨一方有敗龜板酒炙一兩上為細末每服三錢酒下重者煎真人活命湯調下覺腹中作疼則膿毒從大便出矣祕傳妙濟飲治便毒小瘡癤只服此一味將滓罨瘡上其腫即消立效一枝箭水洗去土用出貴州考本草不載上用生白酒煎服得微汗為佳祕傳圍藥解和散如腫毒初起圍敷即消芙蓉葉野菊根蒲黃黃連黃芩黃柏連翹白芨白蘞白芷乳香沒藥雄黃孩兒茶甘草蛇含石煆醋淬赤石脂大黃上為細末用雞子清調敷其瘡四圍腫處如干以雞子清常潤如腫毒重大加萆撥水槿葉祕傳拔毒丹白礬三錢雄黃硼砂辰砂各三分雌黃血竭硇砂各五分牛黃乳香沒藥各二分砒霜一分煉斑蝥三個去翅足巴豆三粒去油上件除白礬各為細末先將白礬用鐵銚熔化後將前藥末摻礬上候煙盡取起置土地上出火毒再研極細末入麝香五釐蟾酥一分輕粉五分再共研和勻用竹筒收貯每用旋取少許以糯米飯搗成藥線如粗布針大焙乾如膿已成者無眼用三稜針刺破將藥線徐徐納入深至痛止外用烏金紙剪如錢大津黏毒上封住其膿自化如已潰爛臭腐眼大者只以末藥津調敷瘡內外亦用烏金紙黏封每用此法須用圍藥護衛好肉祕傳千捶膏萆薢子去殼一兩松香嫩者五錢乳香一錢上用鐵捶於石上搗千下成膏敷毒上外用紙蓋之如小癤毒只消此貼初起即散有膿即出不疼祕傳生肌散孩兒茶赤石脂黃連黃柏松香上研為細末先將瘡口洗淨乾摻瘡上祕傳返魂湯此藥順氣調血扶植胃本何首烏勿犯鐵川歸木通赤芍藥炒白芷不見火茴香炒烏藥炒甘草枳殼麥麩炒如噁心薑汁炒上細切各等分每服四錢用水酒各一盞煎去滓服如血氣盛者減當歸如毒在上及老人虛弱人減木通如流注加獨活如生痰有二證胃寒生痰加半夏熱鬱成風痰加桔梗如有瀉者不用此方宜用蠟礬丸用米飲湯下三十丸瀉止再用此方神仙蠟礬丸治一切癰毒腸癰內托之劑神妙黃蠟七錢白礬一兩研細上將黃蠟熔化和礬為丸如梧桐子大每服二十丸漸加至三十丸食遠用滾白湯送下千金托裡散治背疽並諸惡瘡如三日以內未針灸及利大便者則可消矣姜活一錢五分防風身酒洗防風梢各五分藁本一錢五分川歸身酒洗三錢川歸梢五分連翹酒黃芩各三錢生黃芩人參炙甘草各一錢半生甘草五分陳皮蘇木五味子酒黃柏酒防己各五分桔梗山梔酒生地酒黃連各一錢酒大黃三錢木豬苓一錢五分麥門冬二錢上細切分作二服每服用水三大盞浸半日煎至一盞稍熱服後一服如前並滓再煎服忌冷水此方如覺有病即便忙服無不效者若瘡勢已發三四日或成膿者則不消矣托裡攻治一切惡瘡發背疔瘡便毒始發脈洪數弦實腫甚將作膿者三服消盡大黃牡蠣天花粉皂角刺朴硝便不祕者減去連翹各六分金銀花當歸各二錢赤芍藥黃芩各四分上細切作一服水酒各一盞煎至一盞四分服內托復煎散托裡健胃地骨皮黃芩茯苓芍藥黃耆人參白朮桂心甘草防己當歸各半兩防風一兩蒼朮半斤上細切先以蒼朮用水五升煎至三升去朮入前十二味再煎至三四盞取清汁作三四次終日飲之又煎蒼朮滓如前法入諸藥滓再煎服托裡十補散治瘡腫托裡未成者速散已成者速潰其脈緩澀或弦緊細者身倦惡寒者宜用之人參當歸黃耆各二錢厚朴川芎桔梗防風桂心白芷甘草各一錢上細切作一服用水二盞煎至一盞去滓食遠服祕傳平毒散治癰腫初起取新掘天門冬三五兩洗淨入砂盆內搗細以好酒投之去滓頓服未效再投一二服必愈防風通聖散治瘡瘍通用見卷上散類十全大補湯治瘡瘍已潰氣血兩虛者敗毒散並見卷上祕傳阿魏萬靈膏治發背瘰癧疔腫一切惡瘡癱瘓痛風腳氣等證防風荊芥白芷當歸黃連黃柏連翹蛇蛻蜂房白蘞蒼耳草接骨草羌活山梔大楓子金銀花甘草細辛紫河車何首烏黑醜桔梗牡丹皮車前子苦參白芨萆麻子大黃各二兩穿山甲四十片江子肉八錢望見消二錢木鱉子四十個蝦蟆只柴胡全蠍半夏升麻南星玄參天花粉川烏牛膝黃耆兩頭尖獨活斑蝥地榆五靈脂槐角蒼朮藁本赤茯苓桃仁三稜莪朮小茴香青木香嫩松節各一兩威靈仙天麻藕節薄荷貝母丹參生地黃烏藥各一兩半血餘三錢後入八角風葉下紅各四兩槐枝六兩柳枝六兩黃丹八兩水飛過炒紫色上細切用水八碗浸一日煎稍干下真麻油十六斤同煎至穿山甲等藥如炭黑濾去滓入血餘煎無形影滴水中不散再入黃丹徐徐順攪煎至滴水成珠再入後項藥蜈蚣二條烏蛇肉四兩川烏草烏附子白附子各一兩五加皮紫荊皮各二兩上共研為細末入膏藥內頻頻順攪勻退火入後項藥沉香雄黃各一兩南木香血竭輕粉赤石脂龍骨各二兩乳香沒藥各四兩麝香五錢阿魏一兩用水另溶化再入膏藥內上為細末入膏藥內順攪勻出火毒瓷器收貯每用油紙攤貼須留頂以出其毒疔腫方法灸法以大蒜搗爛成膏塗腫四圍留露腫頂以艾炷灸之以爆為度如不爆稍難愈宜多灸百餘壯無不愈者祕傳妙方治食災牛馬肉成疔腫欲死者以桕油木藥搗爛絞取真汁一二碗頓服得大瀉毒氣乃愈如冬月無葉取嫩根研水服之一二次以利為度楊梅瘡方法楊梅瘡或名綿花瘡蓋因瘡之形相似耳先年惟南廣有此近年以來處處頗多世俗多用厲風藥治之甚得理也每見庸醫求取速效輒以輕粉丹麝等藥大劑投之然其所感有淺深資稟有壯怯其壯受毒氣之淺者幸得平愈其怯弱之人因而變生壞證又有不知禁戒者變成癘瘋亦有用輕粉太多兼以麝香透入骨節遂成瘋塊經年痛痹膿爛可畏然非輕粉不能取效但不可多量人虛實用之祕傳加味醉仙散葫麻子牛蒡子蔓荊子枸杞子四味各炒紫色白蒺藜苦參栝蔞根防風當歸川芎芍藥羌活何首烏白芷姜蠶炒荊芥連翹黃芩山梔皂角刺玄參甘草芙蓉葉威靈仙各一兩上研為細末用米糊為丸如梧桐子大每服七十丸茶清送下如有實熱瘡盛者加輕粉二錢如作煎劑亦可如過服輕粉或瘋痹疙瘩者用山黃牛一味煎湯頻服祕傳遺糧湯治楊梅瘡風漏筋骨疼痛山黃牛三兩二錢五加皮白蘚皮防風木瓜荊芥穗白芷當歸酒洗各一錢五分白芍藥炒生地黃酒洗地骨皮川牛膝黃連甘草槐花炒川芎威靈仙尋風藤白茯苓各一錢杜仲二錢薑汁炒斷絲皂角子三粒搗碎白醜三粒搗碎上細切作一服用水一鍾半酒半鍾煎至一鍾察病患上下飢飽服渣滓再煎服一日一劑服至三五劑其瘡愈腫勿懼畏以托出毒氣故也若輕者服十劑而瘥重者服二十劑全愈每劑服過渣滓日乾煎水常時浴洗患處切忌房事生冷茶清煎炒母雞鵝羊豬首蹄肉魚蝦動風之物無不效者祕傳除厲散治楊梅瘡敷藥陳老鱉甲火煆一錢輕粉二錢杏仁三十個去皮尖上為細末用豬膽調敷神效一方用輕粉一錢膽礬八分為細末撾破敷之其效如神祕傳滌風散此楊梅瘡風漏一切風症此方購費珍價見痔漏類祕傳熏洗方用防風荊芥川芎白芷連翹蒼朮黃芩艾葉何首烏皂角刺白蘚皮地榆威靈仙金銀花蒼耳草上細切各等分用水五升煎乘熱先熏後洗祕傳灸法治楊梅瘡初起那一個的灸三五壯後不再發疳瘡方法祕傳平穢散治下疳瘡又名妒精瘡宜禁房事臨臥含水一口免與陽則不痛瓦壠子火煆五倍子炒孩兒茶各一錢片腦二分上為細末先以防風荊芥烏藥地榆苦參各等分用水五升煎入小瓶內將玉莖納入熏洗後傳藥瘡上立瘥癬瘡方法祕傳息搔散治蟲癬生白礬一兩硫黃五錢檳榔一個上為細末取羊蹄根搗真汁和生蜜少許調如粥厚先以穿山甲抓破患處傳之如瘡過一暈立效祕傳寧癢散治風蟲頑癬川槿皮一兩紅娘子青娘子各七個斑蝥三個去翅貝母五錢檳榔二個上細切用水浸露三日夜擂碎先以穿山甲撾破用鵝翎搽之立已疥瘡方法祕傳靖膚散大楓子四十九枚枯白礬真川椒蛇床子水銀各三錢樟腦五錢上各為細末入水銀共再研勻用桕油調敷一方用蕎麥麵一兩炒黃硫黃一錢另研細用桕油燭調敷皆有奇效祕傳一擦光治疥瘡及婦人陰蝕瘡漆瘡天火丹諸惡瘡毒神效蛇床子苦參蕪荑各一兩雄黃大楓子去殼川椒各半兩硫黃輕粉樟腦各二錢枯礬一兩二錢上各為細末用生豬油調勻敷之祕傳愈疥散治疥瘡並小兒癩頭牛皮岸即熏牛皮煙岸也如無以香爐岸代蛇床子硫黃黃柏黃丹各一兩雄黃大楓子去殼川椒各半兩枯礬二兩輕粉二錢上各為細末以生豬油調勻敷之㾾瘡方法祕傳碧雲膏治㾾瘡神效真麻袖四兩黃蠟三兩半銅青三錢輕粉三分古銅錢三文鮮桃柳枝各七枝上於五月五日製先以香油煎三五沸入蠟並錢煎至浡落入銅青以桃柳枝不住手攪煎至滴水成珠入輕粉再煎一沸以紙濾去滓用瓷碗盛貯待凍掃淨土地覆地上一宿出火毒每用量瘡大小捻作薄餅攤置氈上貼患處外以絹帛系定過三日打開轉貼氈一面再貼三日換藥後貼如前湯火瘡方法神效當歸膏治湯火傷此方斂瘡者生肌肉拔熱毒止疼痛當歸細切黃蠟各一兩麻油四兩上先將當歸入油煎焦黑去滓次入蠟急攪放冷以瓷碗盛出火毒用時以故帛紙攤貼一方用白蠟凡初傷必用鹽罨護壞肉後敷藥則易愈祕傳愈燋群方治湯火瘡用黃蜀葵花浸油內以油敷患處或曬乾研末油調敷之一方用萆麻子肉研爛入蛤粉等分如干再入香油少許調敷一方用定粉研細入豬脂調敷一方用緑豆粉輕粉少許槐樹皮去粗皮焙干為細末香油調敷濕則乾摻一方用蕎麥麵炒黃以井花水調敷腮毒方法祕傳地黃膏治嘴腮腫毒或瘡癤或好食煎爆之物生腫毒皆宜服之生地黃二斤麥門冬半斤敗龜板半斤酥炙另研為末上為細切用水一斗煎至五升濾去渣滓再煎如稠飴下龜板末順攪煎滴水中不散為度以瓷罐盛貯埋地下三日出火毒取出不時白湯調服酒調亦可金瘡方法祕傳桃花散治刀刃傷破及竹木刺皮出血用之則止血生肌川歸赤石脂血竭乳香沒藥滑石爐甘石煆或加何首烏上各等分為細末摻傷處初傷者加龍骨少許久者加樟腦少許正鐵箍散兼治諸般惡瘡貝母五兩去心白芷二兩龍骨二錢蒼耳草燒存性醋拌二兩上為細末用水調或香油調敷濕則乾摻一方治跌撲一時無藥急取褥中扳枝花貼患處尤妙乳癰方法祕傳速效方治女人內外吹奶鴨兒花根葉稍長而圓有刺者是取根一握去皮骨蔥白連根葉三莖上為細切入川椒九粒共搗好生酒或醇酒一盞煎至八分去滓溫服宜少臥出微汗立瘥渣滓加鹽少許敷患處亦妙若腫已成不消用疔腫灸法灸三五壯再服前劑尤捷祕傳羌活保生湯祕傳阿魏萬靈膏並見瘡癢類婦人不孕四十婦人不孕者多因經水失期或多寡不勻若氣虛宜補氣血虛宜補血若肥盛不受胎者宜行濕燥痰使經水勻行依期男子交會不相愆候鮮有不孕者矣祕傳種子方訣云俟女人天癸淨後男女各寢男子日服四物湯一帖以補血之不足女人日服四君子湯一帖以補氣之不足服至三十日三十帖止再俟天癸淨乃同寢感時偏任左體力施精亦要偏注其左蓋子宮有二穴左穴受之成男右穴受之成女故也既受精後令女人側左體曲左足而臥良久不拘直隸無錫縣一談姓老人無子晚得此方一歲生三子今皆總角矣極驗極驗受此方者冀當遍傳以廣斯道也又訣云三十時中兩日半二十八九君須算落紅滿地是佳期金水過時空霍亂霍亂之後枉費工樹頭樹底覓殘紅但解開花能結子何愁丹桂不成叢此蓋婦人月經方絶金水才生此時子宮正開乃受精結胎之候妙合太和之時過此佳期則子宮閉而不受胎矣然男女之分各有要妙存焉如月候方經一日三日五日交會者成男二日四日六日交會者成女過此則不孕矣又云陰血先至陽精後沖縱氣來乘血開裹精陰外陽內則成坎卦之象而為男若陽精先入陰血後參橫氣來助精開裹血陰內陽外則成離卦之象而為女若胎成三月之內男女未分之時亦有轉女為男之術其法以鐵斧一柄置於孕婦床席之下勿令人見知更佩雄黃一二兩於孕婦身左或佩萱花亦可以上三法皆驗不可輕忽傳日不孝有三無後為大古詩云無官一身輕有子萬事足誠哉是言也無嗣者宜深思之無怠調經散治經水不調或前或後或多或少或逾月不至或一月兩來皆可服當歸酒洗一錢五分麥門冬二錢吳茱萸擇去閉口者泡七次焙乾肉桂各五分人參半夏泡七次白芍藥牡丹皮川芎各一錢阿膠珠甘草炙各七分五釐上細切用水二盞姜三片煎至一盞去滓空心稍熱服調經散治月經過期不行宜服當歸一錢五分川芎桂心甘草各五分熟地黃白芍藥香附子莪朮蘇木各一錢木通八分紅花三分桃仁二十個去皮尖研細上細切用水一盞半煎至一盞去滓空心溫服調經散治月經先期而來宜服當歸身一錢五分生地黃條芩香附子各一錢白芍藥黃連薑汁炒各八分川芎阿膠珠艾葉甘草黃柏知母各五分上細切用水二盞煎一盞去滓空心溫服香附調經丸治月經不調血氣刺痛腹脅膨脹頭眩噁心崩漏帶下並皆治之香附子杵去皮毛不拘多少米醋浸一日夜用砂鍋煮令香熟水洗焙乾上為細末醋糊為丸梧桐子大每服五十丸淡醋湯下六味地黃丸治婦人陰血不足無子者服之能致胎孕方見卷上丸類婦人諸證瑣瑣不及備録醫者宜參究先儒之論按理先儒之方則詳矣胎前四十一胎前者宜養血安胎不可用熱劑蓋血得熱則行得冷則凝夫胎涼則安胎熱則墮理之必然四物湯為當四物湯當歸川芎白芍藥熟地黃上細切用水二盞煎服若妊娠下血不止本方加艾葉三十片阿膠珠一錢每服四錢加烏梅肉少許煎進三四服即止或以本方加阿膠珠白朮條芩砂仁香附糯米如惡阻從痰而治本方去地黃加陳皮半夏曲砂仁神麯麥芽藿香白朮陳倉米有熱加生薑汁炒芩連梔子如子煩脈虛大無力或怔忡身戰及時有微熱本方加人參白朮黃芩甘草酸棗仁遠志麥門冬地骨皮如七八個月面目及四肢浮腫本方加茯苓澤瀉白朮條芩炒梔子厚朴麥門冬甘草梢或以本方加紫蘇桔梗黃芩大腹皮枳實滑石如忽然口噤吐沫不省人事言語錯亂本方合二陳湯加麥門冬竹茄遠志石菖蒲如感冒風寒頭痛發熱身痛本方合小柴胡湯加細辛白芷防風羌活胎漏方法固胎散治胎漏下血條芩五錢白朮一兩砂仁炒阿膠珠三錢上為細末每服二錢煎艾湯調下安胎飲治孕成之後覺胎氣不安或腹痛或腰疼或飲食不美宜服或至五六個月常服數帖甚好用白朮川歸白芍藥熱地黃各一錢人參川芎陳皮條芩各五錢紫蘇砂仁甘草各三分生薑水煎服腹痛方法獨聖散治胎前心腹諸痛胎動不安安胎止痛行氣故也若非八九個月不宜多服用砂仁不拘多少去皮略炒為細末每服一匕熱酒或艾湯米飲湯鹽湯皆可調服如覺胎中熱即安矣大抵妊婦不可缺此達生方法引方達生散治孕至八九個月服十數帖甚好則易産腹疼痛大腹皮原本三錢恐太多今用一錢用酒洗曬乾再用烏豆汁洗淨方可用恐鴆毒害人人參陳皮紫蘇連梗葉各五分白芍藥白朮當歸各一錢甘草炙二錢黃楊腦七個食少胎痛勿用上細切用水二盞蔥五葉煎一盞去滓服春加川芎防風夏加芩連五味子秋加澤瀉冬加砂仁或通加枳殼砂仁胎動不安加金銀三五錢野苧麻根一錢氣上逼心加紫蘇地黃性急加柴胡多怒再加黃芩佐之食少加砂仁神麯渴加麥門冬黃芩能食倍加黃楊腦此物能瘦胎不長有痰加半夏曲黃芩氣虛倍加參朮氣實倍陳皮加香附子血虛倍當歸加地黃形實倍紫蘇有熱加黃芩有食積加山楂腹痛加木香養胎散臨月用之能養胎元當歸川芎黃芩陳皮白朮香附各一錢白芷五分甘草二分上細切用水二盞煎去滓調六一散一錢服若虛加人參七分催生方法益母丸治婦人胎前産後及經中諸般奇病並赤白帶惡露時下不止無所不療乃婦人之仙藥也益母草一名茺蔚子紫花方便是五月採陰乾用八兩手摺去根勿犯鐵器川當歸七錢赤芍藥六錢南木香五錢上為細末煉蜜為丸如彈子大每服一丸用童便好酒各半盞化開服若急用時取益母草生者連根搗爛去滓再用童便好酒和勻服若臨産時服一丸安魂定魄破血止痛養血脈調經絡諸病不生若胎前因跌撲觸動胎氣漏胎下血等證併産後諸疾悉見濟陰方加減作湯化下芎歸湯治胎前因事跌撲子死腹中惡露妄下疼痛不已口噤欲絶一切等證臨産催生胞衣不下當歸酒洗一兩川芎七錢陳皮去白五錢惟催生用胎前只用芎歸勿用陳皮上細切用水二大盞煎至一盞入酒半盞再煎頓時去滓服産後四十二産後者須大補氣血為主或有雜證不可用寒涼之劑祕傳歸參湯當歸人參川芎白朮生地黃陳皮白茯苓甘草炙上細切用水二盞姜三片棗一枚煎去滓溫服若腹脹痛發寒熱者是惡露未盡去人參加桃仁紅花乾薑肉桂五靈脂半生半炒甚不已者加熟附子一片此謂陽有餘而陰不足故生內熱更加炒黑乾薑引入肝分理去舊血致生新血也産後雜證方法新産不可用芍藥以其酸寒能伐發生之氣十日內忌之故以黃耆四物湯為補虛之要藥以黃耆易芍藥是也若氣虛者本方加參術茯苓甘草發熱者加乾薑若自汗多者少用川芎勿用茯苓倍加蜜炙黃耆若口渴加五味子麥門冬若腹痛者非芍藥不可雖新産以酒重炒用去酸寒之毒何害之有若惡露不盡作痛四物湯煎去滓調香附五靈脂末服甚者加桃仁泥四五分新産子宮未斂作痛名兒枕痛又名瘕母塊痛用醋炒芍藥粟殼甘草水煎入少米醋或以三物為末醋湯調服酸以收之之義也若産後有惡血不去發寒熱成癥瘕者四物湯加三稜莪朮乳香沒藥香附五靈脂乾漆桃仁紅花之類若産後腹痛不息宜四物加烏藥香附桂心高良薑陳皮童便和醋煎服甚效若産後月餘經水淋瀝不止四物湯加白芷升麻煎調血餘灰服若産後陰痛四物加藁本防風若産後通身浮腫四物加乳香沒藥桂心木通大腹皮良薑血竭檳榔海金沙若産後子腸不收八物湯加升麻防風須以酒炒黃耆為君若産後中風口眼歪邪八物加附子荊芥少加防風羌活若産後血暈用鹿角一段燒存性也火毒為末酒調灌下即醒或用韭葉細切盛於有嘴瓶中以滾醋沃之急封瓶口以瓶嘴納産婦鼻中即蘇或用稱錘磚石燒紅投醋中熏之小産方法補氣血湯治小産下血不止人參黃耆當歸白朮白芍藥艾葉甘草炙阿膠炒川芎青皮香附砂仁上細切用水二盞煎一盞去滓服補血定痛湯治小産心腹疼痛當歸川芎熟地黃白芍藥各錢玄胡索七分桃仁去皮尖研細紅花各三分香附子青皮炒黑澤蘭牡丹皮各五分上細切用水一盞半入童便酒各半盞煎至一盞溫服小兒四十三小兒者參考其證大半胎毒而小半傷食外感風寒者什居一二故其氣體嫩弱易寒易熱用藥不可太驟大概以四君子湯加減調治之其有變蒸驚搐疳蟲瘡疹等證與大人異者其餘諸病則准大人治略具一二以見治法焉變蒸方法惺惺散四君子湯加栝蔞根川芎桔梗細辛少許薄荷煎服急慢驚風方法小兒驚啼手足瘛瘲睡臥不寧宜四君子湯加全蠍去頭足炒鉤藤炮白附姜水煎服急驚宜四君子湯加白附全蠍金箔為末薄荷湯調服下慢驚宜四君子湯加生黑附蜈蚣末蠍梢共一字薑湯調下抱龍丸治小兒諸驚四時感冒邪熱煩躁痰嗽氣急欲出痘疹發搐等證藥性溫平常服驅風化痰鎮心神琥珀人參天竺黃白檀香白茯苓各七錢半甘草炙兩半枳實麥麩炒枳殼麥麩炒各半兩辰砂水飛二兩半山藥炒八兩金箔五十片後研牛膽南星炒半兩上各為細末一處和勻新汲水丸如芡實大陰乾每服一丸用薄荷湯或蔥白湯痰嗽淡姜化下南星膏治小兒精神不定恍惚不寧恐畏多哭常服祛風退熱消痰鎮心除百病牛膽南星臘月以南星為末填入黃牛膽中陰乾風處百日取用宜親手修制者佳稱五錢炒用人參白朮山藥炒白茯苓去皮白茯神去心羌活甘草炙白殭蠶全蠍去毒以薄荷汁浸炙各三錢辰砂二錢水飛另研麝香一分上各為細末一處和勻煉蜜丸如芡實大金箔為衣每服一丸食後用薄荷湯調化服下祕傳瀉肝湯治小兒肝經火旺有餘目睛動搖痰氣上升或壯熱驚搐面色紅脈有力脾胃無傷宜用川芎白芍藥炒半夏湯泡白茯苓各八分當歸酒洗柴胡橘紅枳殼炒天麻各六分黃連酒炒甘草生各四分薄荷三分上細切用水一盞生薑三片煎服祕傳補脾湯治小兒脾經不足土敗木來侮目睛微動搖微驚搐或潮熱往來脾胃有傷飲食少進或泄漏嘔吐面色黃脈無力宜補脾胃白朮一錢三分黃耆蜜炙當歸酒洗川芎人參陳皮肉豆蔻煨神麯炒乾葛各五分白芍藥一錢酒炒白茯苓半夏各七分黃連炒甘草炙各四分上細切用水一盞半生薑三片煎服祕傳安神湯治小兒心血虛而火動睡中驚動不安或受驚嚇而作主清心安神降痰人參半夏泡酸棗仁白茯神各一錢當歸酒洗陳皮去白赤芍藥炒各七分五味子五粒甘草炙三分上細切用水一盞煎去滓納生薑汁竹瀝研細用牛黃末半分服若溫暖月及覺心經熱多加生地黃山梔仁各五分麥門冬七分淡竹葉若方飲食因驚而食即停住不化須先消飲食然後治驚驚藥內仍須用白朮麥芽以理胃也驚則氣散宜收補真氣驚則痰聚便宜化痰祕傳鎮驚丸治驚退後調理安心神養氣血和平預防之劑天竺黃另研人參茯神南星薑製各半兩酸棗仁炒麥門冬去心歸身酒洗生地黃酒洗赤芍藥煨各三錢薄荷木通去皮黃連薑汁炒山梔仁炒辰砂另研水飛牛黃另研龍骨火煨各二錢青黛另研一錢上為細末蜜糊為丸如緑豆大每服三十丸淡薑湯送下疳證方法祕傳檳榔丸治小兒疳病積氣成塊腹大有蟲等證檳榔一兩三稜煨去毛醋炒莪朮醋炒青皮去穰麥麩炒陳皮去白雷丸去殼乾漆炒無煙使君子肉山楂肉麥糵面炒神麯炒黃各半兩蕪荑水洗淨二錢五分鶴蝨略炒木香不見火胡黃連甘草炙各三錢良薑二錢陳壁土炒砂仁一錢上為細末醋糊丸如緑豆大每服三五十丸空心淡薑湯下祕傳治疳湯治小兒大便色泔白小便昏濁或澄之如米泔此泔病也山楂肉白芍藥炒白茯苓黃連薑汁炒白朮澤瀉各一錢青皮四分生甘草三分上細切用水一盞生薑棗煎服祕傳蘆薈丸治小兒疳積腹大此小兒之要藥也胡黃連蘆薈黃連炒使君子去殼各五錢神麯炒一兩阿魏青黛另研各二錢麝香另研少許上為細末稀糊丸如黍米大每服三十丸白朮湯或米飲下吐瀉方法准大人治加減參苓白朮散治小兒吐瀉人參砂仁蓮肉去心各半兩白茯苓去皮八錢土白朮一兩甘草炙七錢肉果炮四錢訶子炮去皮乾薑炒各二錢上研為細末每服三分清米飲湯調服下藿香正氣散治小兒吐瀉見大人感冒類香砂養胃湯治小兒傷食吐瀉見大人內傷類理中湯治小兒霍亂吐瀉見卷上丸類痢疾方法准大人治祕傳香連丸治小兒赤白痢以下三方並見大人痢類參苓白朮散治小兒脾胃虛弱噤口痢疾三黃熟艾湯治小兒熱積臟腑下痢赤白及傷寒四五日大下熱痢及麻疹後下痢食積方法准大人治消食丸又名消乳丸治小兒腹脹腹痛消積滯化乳食大人內傷亦宜砂仁炒橘紅炒三稜炒莪朮炒神麯妙麥糵炒甘草炒各半兩香附炒一兩上為細末湯浸蒸餅為丸如麻子大每服二三十丸食遠白湯送下量兒大小加減愚嘗加土白朮紅曲各五錢為細末每服三分米飲調服效祕傳保和丸治小兒脾胃虛弱飲食不能克化日久羸瘦山楂四兩陳皮去白白茯苓去皮半夏曲各五錢蘿蔔子二錢五分白朮使君子去殼神麯炒麥糵炒各一兩木香二兩二錢四分砂仁四兩四錢黃連四兩零五分上研細末水發為丸如蘿蔔子大每服一錢米飲湯送下香砂養胃湯治小兒傷食脾胃不和腹痛等證見內傷類祕傳解肌理中湯治小兒食積鬱熱發於肌表潮熱往來主理中而清陽明之熱白朮山楂肉白芍藥炒各一錢黃連炒枳實麥麩炒川芎香附子炒升麻各七分乾葛一錢二分生甘草炙甘草各三分上細切用水一盞半生薑三片煎去滓服若積去後潮熱未除減山楂枳實香附川芎加人參黃耆陳皮石膏各五分薄荷二分白朮三分有痰加半夏六分腹痛方法准大人治理脾消食散治小兒腹痛多是飲食所傷此方主之白朮一錢五分陳皮青皮各七分山楂肉神麯炒麥芽炒砂仁炒各一錢甘草炙五分上為細末每服一錢七分清米飲湯調服痛甚者磨木香入服若有寒加藿香吳茱萸各五分有熱加酒炒黃芩七分蟲動方法使君子丸治小兒臟腑虛滑及疳瘦下痢腹脅脹滿不思乳食若常服安蟲補胃消疳肥肌使君子去殼一兩麵裹煨熟去面細切焙乾厚朴去粗皮薑汁炙訶子半生半煨去核用青黛如兼驚帶熱渴即入之如臟腑不調不用甘草炙各半兩陳皮去白二錢五分上研為細末煉蜜和丸如芡實大每服一丸米飲湯化下或乳汁化下不拘時服靈礬散治小兒蟲咬心痛欲絶者五靈脂酒研飛去沙淨為末二錢枯白礬五分上共為末每服二錢水一盞煎至五分不拘時服吐蟲出愈感冒方法祕傳百解散治小兒感冒風寒身熱咳嗽欲出癮疹並痘後欲出麻疹俱宜服之人參七錢甘草炙三錢五分白朮白茯苓各六錢黃耆炒陳皮去白糯米炒各五錢升麻炒二錢川芎白芷各三錢天麻二錢五分姜蠶炒一錢五分南星薑製五分上為細末每服三分傷風用生薑湯或蔥湯欲出麻疹用生薑湯熱甚用薄荷湯調服下加味二陳湯治小兒感冒發熱鼻流清涕或咳嗽痰吐沉重者宜服之陳皮去白半夏湯泡桔梗米泔水浸川芎各五分白朮一錢黃芩酒炒薄荷各三分防風甘草炙各四分白茯苓去皮桑白皮蜜炙各七分上細切用水一盞半生薑三片煎至八分去滓服惺惺散用四君子湯加天花粉川芎桔梗細辛少許薄荷煎服參蘇飲治同前證見大人感冒類藿香正氣散治小兒身熱咳嗽吐瀉等證疑似出痘疹見大人感冒類痰證方法加味白丸子治小兒風痰壅盛南星半兩細切以白礬湯泡日乾或生薑汁製白附子二兩薑製半夏湯泡半兩生薑汁製上為細末麵糊丸如芡實大每服一丸姜蜜薄荷湯任化服重舌木舌方法小兒重舌木舌乃舌下生舌也切不可以刀剪傷之後致言語混沌為沒齒之疾祕傳寧口散治小兒重舌馬牙口舌生瘡咽喉不利方見大人齒病類一方用蒲黃竹瀝調勻敷舌下神效甚者以三稜針於舌

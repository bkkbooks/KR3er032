body:
  text: 凡例一治病之要不過切脈辨證處治三者而已三者之中又以切脈為先苟切脈有差則臨證施治未免有實實虛虛之患但脈有七表八里九道形狀頗多形同實異未易盡之令將各臟脈證姑舉其要括而為圖雖不能強邃奧妙以盡古人之本指初學據此而行由是而馴至乎古聖人之全書可也一脈名二十有四非深於其道及有所授受者未易識也先賢謂脈道雖多而浮沉遲數四目足以該之然遲數之中又有虛實冷熱之分今以遲數屬浮沉以虛實冷熱屬遲數曰滑曰實曰緊曰弦曰洪曰長曰促曰牢曰動實熱之候也曰芤曰微曰緩曰澀曰伏曰濡曰弱曰短曰虛曰結曰代曰細虛冷之候也今括為圖説各具其證與處藥治病之方於下一以五臟及命門分為六圖各以腑附之俱分浮中沉三候浮沉之中又分遲數平遲數之中又分虛實冷熱至於中與平則隨其高下而準準於肌肉之上為浮為表肌肉之下為沉為里肌肉之間為半表半裡是之謂中各以類相從徐者為遲疾者為數無力者為虛有力者為實遲為陰陰冷也鬱則生熱數為陽陽熱也鬱則生寒初學據此以求其病亦庶幾矣一古人方固有為一病而設者亦有數處用者如四君子湯可以補氣可以調氣又可以降氣凡涉於氣證者皆可用之四物湯可以補血可以調血又可以止血凡涉於血證者皆可用之前輩云肝腎同歸於一治愚謂心肺亦當同歸於一治有如八味丸之類既可以補腎又可以補肝金花丸之類既可以治心亦可以治肺腎也肝也心也肺也既可以通治而脾也獨不可以通治乎脾居中州貫乎四臟故善治四臟者未有不治乎脾此承氣湯之類又能治四臟之邪者為是故也引而伸之觸類而長之無不如是故此一書皆摘人所常用之方互可相通者填注於各證之下編成序次使人易於披閲或病證時有出入又當以意消息互相假借而用可也一如舊方分兩與今不同謂一分者即今之二錢半也謂一字者即今之二分半也謂一升者即今之一茶盞也又皆總開若干倉卒用藥未免有布算之勞今於各方之下悉準今之權量作一劑折算一人有大小老少病有新久淺深故醫者因之而酌為衡量是以舊方湯液劑量有用二三錢者有用四五錢者有用七八錢者至一兩者用藥概用大劑病者請藥輒喜大劑殊失古人之意按局方中劫藥至多而劑量至少如嘉禾散隔氣散以二錢為劑五香散祕傳降氣湯以三錢為劑他方中多不過四錢五錢而止又按東垣脾胃論於除風濕羌活湯每服稱三錢升陽散火湯每服稱半兩古人制方或增損或應病率以輕劑為則治之不愈然後用重劑焉於偏寒偏熱峻下之方既以中劑為率又在用藥者臨時制宜以加減云一按仲景活人書為醫方之祖其用薑皆有分兩及有不用薑者今世藥劑每服皆用薑三片無服無者故於用薑條下必開其數不開者不須用於本方外加藥有合用薑者又在臨時去取一炮製藥料自古各有法制今不別立篇目就於各方當制之藥下細注臨用之際必須依法制度不可厭煩而輕率忽略以誤人也一云用水一盞即今之茶盞也約計半斤許凡用水仿此為準一布列五臟命門六圖並系方之外又立各證散購諸家祕藏妙方皆愚嘗試應效備録於後欲使學者執衡之有權耳諺云傳方優於施藥同志君子知忱之非沽名也歟一集是書外又集脈法指明一帙醫論集粹一帙有志未梓姑俟優暇云

front:
  text: 序古昔聖神御極海內熙熙焉如登春臺人臻壽域此曷繇故太和融液淪肌理浹腸腎六氣不侵而災眚不作稟氣含生之屬靡不百體堅強而相愈佚於耄耋期頤中世虐政日逞上薄天和而民乃有夭札疵殤自非診脈候治方藥霜露之恙何所底止故扁鵲曰越人非能生死人此自當生者越人能生之耳古來醫術自岐黃盧扁而下如河間東垣丹溪仲景節菴錢薛諸氏無慮數十家大都神術妙解幾於見垣不可軒輊而我歙宗人松崖公夙蘊弘猷蜚英甲第抱康濟斯民之念扶顛持危之情肫肫無已鐫有醫徑探本推原條分縷析精入三昧直與河間東垣諸君並驅爭先久而板蠡散遺未廣其傳豫幡閲諸書中得其存帙撫髀嘆曰何事使仁者寸腔惻隱救世熱腸不為弘敷哉蓋徑者徑約直捷之謂也取途便而奏效速用力微而成功博矧其分門別類有一病則次一脈按一脈則著一方病者千變萬態而或湯或散或飲或丸治法層見疊出不必遠稽古籍近搜旁門惟按類推求如持左券夫天之生愛萬物靡不欲其皆榮而無瘁皆息而無消然合闢相乘時序必至所恃有體天之心培物之命為醫藥者救療之調攝之令上蒼生愛常存而王者熙皞不墜云爾是書也藥無不投之劑人無不醫之疾即素不諳醫者時一展卷治方犂然畢具信乎初學之指南涉海之斗杓而窮原探本之捷徑乎今天子方垂憫黎元而萬方喜更生之會得醫徑之書而廣傳之是亦壽域春臺之一助也豫不事篡輯不為較訂但循其舊式而更新之以俟同志者採焉龍飛天啓乙丑春月之吉方叔居士程開社撰
